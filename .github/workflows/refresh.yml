# OPTIONAL hosting recipe (not deployed): GitHub Pages + scheduled refresh. Needs a GitHub repo containing this folder.
name: refresh-stoopids
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: cache
          key: stoopids-cache-${{ github.run_id }}
          restore-keys: stoopids-cache-
      - run: python3 refresh.py
      - run: |
          git config user.name stoopids-bot; git config user.email bot@users.noreply.github.com
          git add data.js data.json roster_snapshot.json
          git diff --cached --quiet || (git commit -m "refresh" && git push)
