<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STOOPIDS Draft Room v2</title>
<meta name="theme-color" content="#ffd23f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draft v2">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" id="fav" type="image/png" href="icon-192.png">
<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(74px + var(--sb));min-height:100vh}
a{color:var(--acc)}
button{font:inherit;color:inherit;cursor:pointer}
.ribbon{background:repeating-linear-gradient(-45deg,#ffd23f 0 14px,#e6b800 14px 28px);color:#111;text-align:center;font-weight:900;font-size:12px;letter-spacing:.04em;padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top,0px))}
.wrap{max-width:1100px;margin:0 auto;padding:0 10px}
header{display:flex;align-items:center;gap:8px;padding:10px 0 6px;flex-wrap:wrap}
h1{color:var(--acc);margin:0;font-size:clamp(28px,8vw,44px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 small{display:block;font-size:12px;letter-spacing:.08em;color:var(--mut);font-weight:700;margin-top:3px}
.hr{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.live{color:var(--good);border-color:#1f6b3d}.pill.bad{color:var(--warn);border-color:#8a6d12}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.live i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800;font-size:14px}
.btn.pri{background:var(--acc);color:#111;border-color:var(--acc)}
.btn.bad{background:#3a1717;border-color:#7f2d2d;color:#ffb4b4}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--acc);text-decoration:underline;padding:0;font-size:12px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:15px}
.mut{color:var(--mut)}.small{font-size:12px}
/* banner */
.banner{border-radius:16px;padding:12px 14px;margin:8px 0;background:var(--card);border:1px solid var(--line);display:flex;gap:12px;align-items:center}
.banner .em{font-size:34px;line-height:1;flex:none}
.banner .bm{flex:1;min-width:0}
.banner .lbl{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--acc)}
.banner .nm{font-size:22px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.banner .sb{color:var(--mut);font-size:13px;margin-top:2px}
.banner .cd{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
.banner .cd small{display:block;font-size:10px;color:var(--mut);font-weight:700;letter-spacing:.05em}
.banner.me{background:var(--acc);color:#111;border-color:#fff;animation:glow 1.4s infinite}
.banner.me .lbl,.banner.me .sb{color:#2b2400}.banner.me .nm{font-size:23px}
.banner.near{border-color:var(--acc)}
.cd.low{color:var(--bad)}
.banner.me .cd.low{color:#a10000}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(255,210,63,.35)}}
.alertbar{background:#4b3a0b;border:1px solid #8a6d12;color:#ffe08a;border-radius:12px;padding:8px 12px;margin:6px 0;font-weight:700}
.ticker{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.tk{flex:none;display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 8px 2px 8px;font-size:12px}
.tk b{color:var(--acc)}
.roastline{font-size:13px;color:#dfe5f3;background:var(--card);border-left:3px solid var(--acc);padding:6px 10px;border-radius:8px;margin:2px 0 6px}
/* chips */
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%;white-space:nowrap}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-block}
.chip.big{font-size:15px;padding:3px 11px 3px 3px}.chip.big img{width:30px;height:30px}
.chip.sm{font-size:11px;padding:1px 6px 1px 1px}.chip.sm img,.chip.sm .nologo{width:18px;height:18px}
.chip:hover{filter:brightness(1.12)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0b0e14;border-top:1px solid var(--line);display:flex;padding-bottom:var(--sb);z-index:20}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px 7px;color:var(--mut);font-size:11px;font-weight:800;position:relative}
nav.tabs button span{display:block;font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--acc)}
nav.tabs button .bd{position:absolute;top:3px;left:55%;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-weight:900}
/* board */
.bwrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:70vh}
table.board{border-collapse:separate;border-spacing:0;min-width:100%}
.board th,.board td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;text-align:center;vertical-align:middle}
.board th{position:sticky;top:0;background:#151a25;z-index:2;font-size:11px;min-width:96px;padding:5px 3px}
.board th .oe{font-size:18px;display:block}
.board th.me{background:#3a3211;color:var(--acc)}
.board th.rh,.board td.rh{position:sticky;left:0;z-index:3;min-width:38px;width:38px;background:#151a25;font-size:11px;font-weight:900;color:var(--mut)}
.board td{height:50px;min-width:96px;position:relative}
.board td .pn{position:absolute;top:1px;left:3px;font-size:9px;color:var(--mut);font-weight:800}
.board td.cur{outline:2px solid var(--acc);outline-offset:-2px;background:#2a2410;animation:glow 1.4s infinite}
.board td.mine{background:#1f2616}
.board td .dim{color:#3d465c;font-size:12px;font-weight:800}
.board td .chip{max-width:90px;overflow:hidden}
.board td .au{position:absolute;top:1px;right:3px;font-size:9px}
/* teams */
.ctl{position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:4}
input[type=search],input[type=text],input[type=password],select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
select{width:auto;padding:6px 8px;font-size:14px}
input:focus{border-color:var(--acc)}
.pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.pills button{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:800}
.pills button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.trow{display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:5px 0}
.trow.taken{opacity:.5}
.trow.go{cursor:pointer}
.trow .tm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.trow .tm small{color:var(--mut);font-size:11px}
.trow .rk{font-size:11px;color:var(--mut);font-weight:800;min-width:28px;text-align:center}
.star{background:none;border:1px solid var(--line);border-radius:8px;font-size:18px;line-height:1;padding:5px 8px;color:var(--mut)}
.star.on{color:var(--acc);border-color:var(--acc)}
/* misc */
.tag{display:inline-block;font-size:10px;font-weight:900;border-radius:6px;padding:1px 6px;letter-spacing:.04em}
.tag.steal{background:#12351f;color:var(--good)}.tag.reach{background:#3a1717;color:#ffb4b4}.tag.curse{background:#3d2a05;color:#ffb347}.tag.dart{background:#1b2a45;color:#9cc2ff}.tag.fair{background:var(--card2);color:var(--mut)}.tag.auto,.tag.first,.tag.last{background:var(--card2);color:var(--acc)}
.opills{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.opills button{flex:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-weight:800;font-size:13px}
.opills button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.qrow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border:0}
.qn{width:22px;color:var(--acc);font-weight:900;text-align:center}
.sw{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.sw input{width:20px;height:20px;accent-color:var(--acc)}
.rrow{display:flex;gap:8px;align-items:center;margin:4px 0;padding:6px 8px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.rrow .no{color:var(--acc);font-weight:900;width:22px}
.grid2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;gap:6px;margin:6px 0}
.seg button{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px;font-weight:800}
.seg button.on{background:var(--acc);color:#111;border-color:var(--acc)}
.msg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin:6px 0;max-width:92%}
.msg.mine{margin-left:auto;background:#2a2410;border-color:#5b4a12}
.msg .who{font-size:11px;font-weight:900;color:var(--acc)}
.msg .tx{overflow-wrap:anywhere;white-space:pre-wrap}
.msg .rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rx button{background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;font-size:12px}
.rx button.on{border-color:var(--acc);background:#3a3211}
.chatbox{position:sticky;bottom:calc(66px + var(--sb));display:flex;gap:6px;background:var(--bg);padding:8px 0;z-index:4}
.recap{border:2px solid var(--acc)}
.recap .hd{font-size:18px;font-weight:900;color:var(--acc)}
.recap .st{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;font-size:12px}
/* overlay + sheet + toast */
.ov{position:fixed;inset:0;background:rgba(5,7,11,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
.ov h2{color:var(--acc);margin:0 0 4px;font-size:28px}
.who8{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;margin:14px 0}
.who8 button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-weight:900;font-size:16px}
.who8 button span{display:block;font-size:26px}
.who8 button:active{background:var(--acc);color:#111}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-top:3px solid var(--acc);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--sb));width:100%;max-width:520px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sb));background:#0b0e14;border:1px solid var(--acc);color:var(--tx);padding:9px 14px;border-radius:12px;z-index:60;max-width:92vw;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.5);text-align:center}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.qr svg{width:210px;height:210px}
.stub{border-style:dashed;opacity:.9}
.hide{display:none!important}
body[data-tab=teams] #roastline,body[data-tab=teams] #ticker,body[data-tab=my] #roastline,body[data-tab=my] #ticker,body[data-tab=admin] #roastline,body[data-tab=admin] #ticker{display:none}
body[data-tab=teams] .banner{padding:8px 12px}body[data-tab=teams] .banner .em{font-size:26px}body[data-tab=teams] .banner .nm{font-size:18px}
.urlbox{font-size:12px;word-break:break-all;background:var(--card2);padding:6px 8px;border-radius:8px;margin:6px 0;user-select:all}

/* v2 additions */
.ctl .sortlbl{display:block;margin:8px 2px 3px;font-size:12px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:var(--acc)}
.ctl .sortsel{display:block;width:100%;box-sizing:border-box;padding:11px 12px;font-size:16px;font-weight:800;border:2px solid var(--acc);border-radius:12px;background:var(--card);color:var(--tx)}
.pickbtn{display:block;width:100%;margin:8px 0 0;padding:13px;font-size:16px}
#pickov{position:fixed;inset:0;background:#10131a;z-index:35;overflow:auto;-webkit-overflow-scrolling:touch}
#pickov .pbox{max-width:560px;margin:0 auto;padding:8px 10px calc(70px + var(--sb))}
#pickov .phead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 2px}#pickov .phead small{display:block;color:var(--mut)}
#pickov .ctl{top:0}
.ctl .row2{display:flex;gap:6px}.ctl .row2 select{flex:1;min-width:0;padding:8px 10px;font-size:15px}
.ctl .pills{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}.ctl .pills button{white-space:nowrap;flex:none}
.grp{background:var(--bg);margin:10px 0 2px;padding:3px 2px;font-weight:900;font-size:13px;color:var(--acc);display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.grp small{color:var(--mut);font-weight:700}
.wstar{background:none;border:0;font-size:20px;line-height:1;padding:2px 4px;color:#586079}.wstar.on{color:var(--acc)}
.qbtn{background:none;border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:900;padding:5px 6px;color:var(--mut)}.qbtn.on{color:#111;background:var(--acc);border-color:var(--acc)}
.trow .rk{min-width:34px}.trow .rk small{display:block;font-size:9px;font-weight:700;color:#6f7893}
.trow.taken .tm .chip{filter:grayscale(.6)}
.dr{font-size:10px;font-weight:900;color:#9fd7a8}
.lockcard{border-color:#7f6a1d}.errtxt{color:#ff9a9a;font-weight:800;margin:6px 0;min-height:18px}
.pin{letter-spacing:4px;text-align:center;font-size:22px!important}
.cflict{background:#3a1717;border:1px solid #7f2d2d;color:#ffd0d0;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:800}

/* badge for model teams without pool data */
.nodata{background:#2a2410;border:1px dashed #8a6d12;color:#ffe08a;border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;margin-top:2px}
/* build tag */
#buildtag{font-size:11px;color:var(--mut);margin:2px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#buildtag b{color:var(--acc)}#buildtag a{color:var(--acc);text-decoration:underline;font-weight:800}
/* presence strip (look copied from the STOOPIDS site "Online now") */
#presence{margin:6px 0}#presence[hidden]{display:none}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 9px;min-width:0}
.pr .prl{font-size:12px;font-weight:800;color:var(--acc);margin-right:2px;white-space:nowrap}
.pc{display:inline-flex;align-items:center;gap:5px;max-width:100%;min-width:0;padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:12.5px;font-weight:700;line-height:1.2}
.pc .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .pd{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px rgba(74,222,128,.22);flex:none}
.pc.on{border-color:#2f6b47}.pc.off{opacity:.78;background:transparent;border-style:dashed;color:var(--mut);padding:2px 9px}.pc.off .pd{background:#5b6578;box-shadow:none}
.pc .pt{display:flex;flex-direction:column;min-width:0}.pc small{font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap;line-height:1.15}
.pc.me{border-color:var(--acc)}.pc.me .pe{font-size:10px;color:var(--acc);font-weight:800}
/* draft-order wheel */
#wheelov{position:fixed;inset:0;background:rgba(8,10,16,.88);z-index:45;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:10px}
.wbox{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:18px;padding:12px;width:100%;max-width:420px}
.wbox h2{margin:0 0 4px;font-size:19px}
.wheelwrap{position:relative;width:min(100%,300px);margin:6px auto}.wheelwrap svg{width:100%;height:auto;display:block;overflow:visible}
.wptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:22px solid var(--acc);filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));z-index:2}
#wg{transform-box:view-box;will-change:transform}
.wslots{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin:8px 0}.wslot{display:flex;gap:6px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;font-weight:700;min-width:0}
.wslot b{color:var(--acc);min-width:18px}.wslot.next{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}.wslot.empty{color:var(--mut);font-weight:600}.wslot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wwin{text-align:center;font-weight:900;font-size:16px;min-height:24px;color:var(--acc)}
.olist .rrow{display:flex;gap:8px;align-items:center;padding:4px 0}
</style>
</head>
<body>
<div class="ribbon">🧪 TEST MODE – nothing here affects the live pool</div>
<div class="wrap">
  <header>
    <h1>STOOPIDS<small>SNAKE DRAFT ROOM · V2</small></h1>
    <div id="buildtag"><span>Draft room <b>v2</b> · build <b id="buildid">2026-10-27c</b></span><a href="#" data-a="reloadlatest" id="reloadlatest">Reload latest</a></div>
    <div class="hr">
      <span id="conn" class="pill bad"><i></i>Connecting…</span>
      <span id="who" class="pill"></span>
      <button class="btn sm" data-a="invite">📨 Invite</button>
    </div>
  </header>
  <div id="alertbar"></div>
  <div id="banner"></div>
  <div id="roastline"></div>
  <div id="ticker" class="ticker"></div>
  <div id="presence" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="overlay"></div>
<div id="sheetwrap"></div>

/* ---------- the write protocol, with injectable IO so it can be unit-tested against a fake textdb ----------
   io: {read(url)->text, write(url,obj), sleep(ms), adopt(n,entryOrNull) = optimistic local view, later(fn) = fire-and-forget re-check, alert(n,entry) = our pick was later displaced}
   o:  {meta, url, n, entry, taken = teams taken by slots before n, pool, fast}  */
async function submitSlot(io,o){const NOCONN="Can't reach the draft server. Check your connection and try again.";
  for(let attempt=0;attempt<3;attempt++){
    let ex;try{ex=parseEntry(await io.read(o.url))}catch(e){return{ok:false,msg:NOCONN}}
    if(ex&&ex.id===o.entry.id)break;
    if(!slotWritable(o.meta,ex,o.n,o.taken,o.pool)){io.adopt(o.n,ex);return{ok:false,beaten:true,by:ex}}
    try{await io.write(o.url,o.entry)}catch(e){if(attempt===2)return{ok:false,msg:'Save failed (server hiccup). Nothing was changed — try again.'};await io.sleep(400);continue}
    io.adopt(o.n,o.entry);
    if(o.fast)return{ok:true,pick:o.entry,unverified:true};
    await io.sleep(600);let chk=null;try{chk=parseEntry(await io.read(o.url))}catch(e){return{ok:true,pick:o.entry,unverified:true}}
    const out=claimOutcome(chk,o.entry,o.meta);
    if(out==='landed'){io.later(async()=>{await io.sleep(1800);try{const c2=parseEntry(await io.read(o.url));if(claimOutcome(c2,o.entry,o.meta)!=='landed'){io.adopt(o.n,c2);io.alert(o.n,o.entry)}}catch(e){}});return{ok:true,pick:o.entry}}
    if(out==='beaten'){io.adopt(o.n,chk);return{ok:false,beaten:true,by:chk}}
  }
  return{ok:false,msg:'Could not confirm your pick landed. Check the board before trying again.'}}

const NOCONN="Can't reach the draft server. Check your connection and try again.";
/* ---- meta writes (commissioner actions): re-read -> apply to the FRESH copy -> POST -> verify -> retry if overwritten ---- */
async function mutateMeta(fn,verify){
  for(let attempt=0;attempt<3;attempt++){
    let raw;try{raw=await readRaw(CFG.url)}catch(e){return{ok:false,msg:NOCONN}}
    const cur=normM(raw);const r=fn(cur,deriveState(cur,ENT,PREF,POOLSET));
    if(r.error)return{ok:false,invalid:true,msg:r.error};
    if(r.noop)return{ok:true,noop:true};
    const ns=r.state;ns.version=(cur.version||0)+1;ns.updated=new Date().toISOString();
    try{await postJ(CFG.url,ns)}catch(e){return{ok:false,msg:'Save failed (server hiccup). Nothing was changed — try again.'}}
    Mraw=JSON.stringify(ns);rebuild();
    await sleep(650);
    try{const chk=normM(await readRaw(CFG.url));if(verify(chk,ns)){Mraw=JSON.stringify(chk);rebuild();return{ok:true,state:ns,undone:r.undone}}}catch(e){return{ok:true,state:ns,unverified:true}}
  }
  return{ok:false,lost:true,msg:'Someone else saved at the same moment and your change did not stick. Look at the screen and try again.'}}
/* ---- per-owner prefs (queue/auto): single writer per key, so a plain read-modify-write is safe ---- */
async function mutatePref(owner,fn,verify){
  for(let attempt=0;attempt<2;attempt++){
    const url=prefKey(CFG.url,owner);let cur;try{await readPref(owner);cur=clone(PREF[owner]||{queue:[],auto:false,v:0})}catch(e){return{ok:false,msg:NOCONN}}
    const ns=fn(cur);ns.v=(cur.v||0)+1;
    try{await postJ(url,ns)}catch(e){return{ok:false,msg:'Save failed — try again.'}}
    PREF[owner]=ns;PREFraw[owner]=JSON.stringify(ns);rebuild(true);
    await sleep(500);try{const t=await readRaw(url);const d=parseJ(t);if(d&&verify(d))return{ok:true}}catch(e){return{ok:true}}}
  return{ok:false,msg:'Could not save that setting — try again.'}}
/* ---- one pick = one key.  check slot -> write -> re-read to confirm -> retry if the write vanished ---- */
async function submitPick(n,owner,tid,by,o){o=o||{};
  const entry=makeEntry(n,owner,tid,{by,now:nowSrv(),writer:WRITER,epoch:M.epoch});
  const io={read:readRaw,write:postJ,sleep,adopt:(k,e)=>{ENT[k]=e||null;ENTraw[k]=e?JSON.stringify(e):'';rebuild()},later:fn=>{fn()},alert:(k)=>toast('⚠️ Pick #'+k+' was replaced by a simultaneous write — check the board.',6000)};
  return submitSlot(io,{meta:M,url:slotUrl(n),n,entry,taken:takenMap({picks:S.picks.filter(p=>p.n<n)}),pool:POOLSET,fast:o.fast})}
/* ---- chat: separate blob; merge by id; never drop a message we sent until it is seen on the server ---- */
async function chatWrite(fn,verify){
  for(let attempt=0;attempt<4;attempt++){
    let raw;try{raw=await readRaw(CFG.chatUrl)}catch(e){return{ok:false,msg:NOCONN}}
    const cur=normC(raw);const r=fn(cur);if(r.error)return{ok:false,msg:r.error};
    const ns=r.state;ns.version=(cur.version||0)+1;
    try{await postJ(CFG.chatUrl,ns)}catch(e){return{ok:false,msg:'Message not sent (server hiccup).'}}
    Craw=JSON.stringify(ns);const pc=C;C=mergeChat(ns,pendingChat);onChat(pc,C);
    await sleep(600);try{const chk=normC(await readRaw(CFG.chatUrl));if(verify(chk,ns)){pendingChat=pendingChat.filter(m=>!chk.msgs.some(x=>x.id===m.id));Craw=JSON.stringify(chk);const p2=C;C=mergeChat(chk,pendingChat);onChat(p2,C);return{ok:true}}}catch(e){return{ok:true}}
  }
  return{ok:false,msg:'Message may not have been delivered (busy server). It will retry on the next refresh.'}}

function needUnlock(){if(commish())return true;toast('🔒 Commissioner tools are locked. Unlock them in the Admin tab.',4500);return false}
async function doPick(tid,forOwner,opt){opt=opt||{};if(busy)return;busy=true;
  try{
    await pollOnce();                         /* merge everything we have not seen yet BEFORE judging the pick */
    const v=validatePick(S,forOwner,String(tid),{pool:POOLSET});
    if(v.error){const tk=takenMap(S)[String(tid)];
      if(tk)toast('😬 Someone beat you to it: '+tn(tid)+' was just taken by '+tk.owner+' (pick #'+tk.n+'). Pick another.',6000);
      else if(v.turn){const s=onClock(S);toast("😬 It's "+(s?s.owner:'someone else')+"'s turn now (pick #"+(s?s.n:'?')+'). The board moved while you were choosing.',6000)}
      else toast('⚠️ '+v.error,5000);return false}
    if(forOwner!==me&&!opt.auto&&!opt.sim&&!needUnlock())return false;
    const by=opt.auto?'auto':opt.sim?'sim':(forOwner!==me?'commish':'owner');
    const res=await submitPick(v.slot.n,forOwner,tid,by);
    if(res.ok){toast('✅ '+own(forOwner).emoji+' '+forOwner+' drafted '+tn(tid)+' (#'+res.pick.n+')');return true}
    if(res.beaten){const w=res.by||{};toast('😬 Someone beat you to it: pick #'+v.slot.n+' was just made ('+tn(w.tid)+' by '+(w.owner||'someone')+'). Check the board.',6500);showConflict(v.slot.n,tid,w);return false}
    toast('⚠️ '+res.msg,5000);return false;
  }finally{busy=false}}

const actQMove=(owner,tid,d)=>mutatePref(owner,cur=>{const q=cur.queue,i=q.indexOf(String(tid)),j=i+d;if(i>=0&&j>=0&&j<q.length)[q[i],q[j]]=[q[j],q[i]];return cur},d=>true).then(r=>{if(!r.ok)toast('⚠️ '+r.msg)});
const actAuto=(owner,on)=>mutatePref(owner,cur=>{cur.auto=!!on;return cur},d=>!!d.auto===!!on).then(r=>{if(!r.ok)toast('⚠️ '+r.msg);else toast(on?'🤖 Auto-pick ON for '+owner:'Auto-pick off')});
async function actSim(n){if(!needUnlock())return;await pollOnce();if(S.status!=='live'){toast('⚠️ Start the draft first, then simulate.');return}
  busy=true;let k=0;try{while(k<n&&S.status==='live'){const s=onClock(S);const taken=takenMap(S);const av=POOL.filter(t=>!taken[t]);if(!av.length)break;
    const t=av[Math.floor(Math.random()*av.length)];const r=await submitPick(s.n,s.owner,t,'sim',{fast:true});if(!r.ok){toast('⚠️ '+(r.msg||'Simulation stopped: someone else picked.'));break}k++}}finally{busy=false}
  toast('🎲 '+k+' simulated pick'+(k===1?'':'s')+' added');kick()}
async function actReset(){if(!needUnlock())return;
  const r=await mutateMeta(m=>mReset(m),chk=>chk.epoch>0);toast(r.ok?'🧹 Test draft reset (old picks are kept in the log, just no longer used)':'⚠️ '+r.msg)}
/* ---- commissioner passcode ---- */
async function actSetPass(pass,requireEmpty){if(!passOk(pass))return{ok:false,msg:'Use at least 4 characters.'};
  let p;try{p=await makePass(pass)}catch(e){return{ok:false,msg:'This browser cannot hash passcodes here (Web Crypto needs https:// or localhost).'}}
  const r=await mutateMeta(m=>mSetPass(m,p,requireEmpty),chk=>!!chk.pass&&chk.pass.hash===p.hash);
  if(r.ok){lsSet('cmtok',p.hash)}return r}
let pinTries=0,pinLock=0;
async function actUnlock(pass){if(Date.now()<pinLock)return{ok:false,msg:'Too many wrong tries. Wait '+Math.ceil((pinLock-Date.now())/1000)+'s.'};
  if(!M||!M.pass)return{ok:false,msg:'No passcode is set yet.'};
  if(await checkPass(M,pass)){pinTries=0;lsSet('cmtok',M.pass.hash);return{ok:true}}
  pinTries++;if(pinTries>=5){pinLock=Date.now()+30000;pinTries=0;return{ok:false,msg:'Wrong passcode. Locked for 30 seconds.'}}
  return{ok:false,msg:'Wrong passcode. Try again ('+(5-pinTries)+' left).'}}
const prankOf=t=>((window.TEAMMETA||{})[t]||{}).p||0;
/* auto-pick executor: any client may run it; the slot key + verify make duplicates harmless (auto entries are deterministic) */
let autoPlan={n:0,at:0},autoBusy=false;
function autoTick(){if(!S||!loaded||autoBusy||busy)return;const s=onClock(S);if(!s){autoPlan={n:0,at:0};return}
  const reason=autoReason(S,nowSrv(),CFG.graceMs);if(!reason){autoPlan={n:0,at:0};return}
  if(autoPlan.n!==s.n){autoPlan={n:s.n,at:Date.now()+(reason==='auto'?900:0)+Math.random()*1500};return}
  if(Date.now()<autoPlan.at)return;
  autoBusy=true;autoPlan.at=Date.now()+5000;const n=s.n;
  (async()=>{await pollOnce();const s2=onClock(S);if(!s2||s2.n!==n||!autoReason(S,nowSrv(),CFG.graceMs-200))return;
    const ch=autoChoice(S,s2.owner,POOL,mulberry(n*7919),prankOf);if(!ch)return;
    const r=await submitPick(n,s2.owner,ch.tid,'auto');if(r&&r.ok)toast('🤖 Auto-pick: '+tn(ch.tid)+' for '+s2.owner)})().finally(()=>{autoBusy=false})}

/* ===================== DRAFT-ORDER WHEEL ===================== */
const WH={open:false,playing:false,queue:[],shown:null,gen:0,resp:null,all:false,cur:null,busy:false,reduced:(function(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})()};
const wlabel=n=>{const o=own(n);return(o.emoji||'')+' '+n};
function spinInfo(){return M&&M.spin?spinReplay(M,SPIN):{winners:[],recs:[],done:false,total:0}}
function onSpinState(){if(!M)return;const gen=M.spin?M.spin.gen:0;
  if(WH.resp==null)WH.resp=M.respins.length;else if(M.respins.length>WH.resp){WH.resp=M.respins.length;toast('🎡 The commissioner re-spun the draft order!',6000)}
  if(gen!==WH.gen){WH.gen=gen;SPIN={};SPINraw={};if(WH.shown!=null){WH.shown=0;WH.queue=[]}}
  const sp=spinInfo();
  if(WH.shown==null){WH.shown=sp.winners.length;return}                       /* late join / wake: show the result, no replay */
  sp.recs.forEach(r=>{if(r.n>WH.shown&&!WH.queue.some(q=>q.n===r.n)&&!(WH.cur&&WH.cur.rec.n===r.n)){
    if(nowSrv()-r.ts>25000&&!WH.playing){WH.shown=r.n}else{WH.queue.push(r);if(!WH.open&&M.spin&&!M.orderLocked){WH.open=true}}}});
  renderWheel();pumpWheel()}
function wheelSVG(players,rot,trans){const n=players.length,seg=360/n,R=140,C=150;const pal=['#ffd23f','#4ade80','#60a5fa','#f472b6','#fb923c','#a78bfa','#2dd4bf','#f87171'];let w='';
  if(n===1){w=`<circle cx="${C}" cy="${C}" r="${R}" fill="${pal[0]}"/>`;w+=`<text x="${C}" y="${C-4}" text-anchor="middle" font-size="18" font-weight="900" fill="#111">${esc(own(players[0]).emoji||'')}</text><text x="${C}" y="${C+18}" text-anchor="middle" font-size="16" font-weight="900" fill="#111">${esc(players[0])}</text>`}
  else players.forEach((p,i)=>{const a0=(i*seg-90)*Math.PI/180,a1=((i+1)*seg-90)*Math.PI/180;const x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
    w+=`<path d="M${C} ${C}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${seg>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${pal[i%pal.length]}" stroke="#10131a" stroke-width="2"/>`;
    const mid=(i+.5)*seg;const nm=p.length>11?p.slice(0,10)+'…':p;
    w+=`<g transform="rotate(${mid-90} ${C} ${C})"><text x="${C+52}" y="${C+4}" font-size="${n>6?12:14}" font-weight="900" fill="#111">${esc(own(p).emoji||'')} ${esc(nm)}</text></g>`});
  return `<svg viewBox="0 0 300 300" role="img" aria-label="Draft order wheel"><g id="wg" style="transform-box:view-box;transform-origin:150px 150px;transform:rotate(${rot||0}deg);${trans||''}">${w}</g><circle cx="150" cy="150" r="16" fill="#10131a" stroke="#ffd23f" stroke-width="3"/></svg>`}
function slotsHTML(winners,total,nextN){let h='';for(let i=1;i<=total;i++){const w=winners[i-1];h+=`<div class="wslot${w?'':(i===nextN?' next':' empty')}"><b>${i}</b><span>${w?esc(wlabel(w)):(i===nextN?'next spin…':'—')}</span></div>`}return h}
function renderWheel(){let el=document.getElementById('wheelov');
  if(!WH.open){if(el)el.remove();return}
  const sp=spinInfo();const cm=commish();
  if(!el){el=document.createElement('div');el.id='wheelov';el.setAttribute('role','dialog');el.setAttribute('aria-label','Draft order spin');document.body.appendChild(el)}
  if(WH.playing&&el.querySelector('#wg')){const ws=el.querySelector('#wslots');if(ws)ws.innerHTML=slotsHTML(sp.winners.slice(0,WH.shown),sp.total||S.order.length,WH.shown+1);return}   /* never rebuild the wheel mid-spin */
  if(M.orderLocked){el.innerHTML=`<div class="wbox"><h2>🔒 Order locked</h2>${orderListHTML()}${respinNote()}<div class="grid2" style="margin-top:10px">${cm&&S.status==='setup'&&!S.picks.length?'<button class="btn bad" data-a="respin">🎡 Re-spin…</button>':''}<button class="btn pri" data-a="wclose">Close</button></div></div>`;return}
  const shown=sp.winners.slice(0,WH.shown||0);const players=remainingPlayers((M.spin||{players:M.order}).players,shown);const total=sp.total||M.order.length;
  el.innerHTML=`<div class="wbox"><h2>🎡 Draft order spin</h2><div class="small mut">Each spin picks one player for the next draft slot; they leave the wheel. Result is decided once by the commissioner's phone and shown the same way on every phone.</div>
   <div class="wheelwrap"><div class="wptr"></div>${players.length?wheelSVG(players,0,''):'<div class="card mut" style="text-align:center">All slots filled</div>'}</div>
   <div class="wwin" id="wwin">${shown.length===total?'✅ Order complete — locking…':(shown.length?'Last: '+esc(wlabel(shown[shown.length-1]))+' → pick #'+shown.length:'')}</div>
   <div class="wslots" id="wslots">${slotsHTML(shown,total,shown.length+1)}</div>
   <div class="grid2" id="wbtns">${cm&&shown.length<total?(WH.all?'<button class="btn bad" data-a="spinstop">⏹ Stop after this spin</button>':'<button class="btn pri" data-a="spinnext">🎡 Spin</button><button class="btn" data-a="spinall">⏩ Spin all</button>'):''}<button class="btn" data-a="wclose">${cm?'Hide':'Close'}</button></div>${cm?'':'<div class="small mut" style="margin-top:6px">Only the commissioner can spin. This view updates by itself.</div>'}</div>`}
function pumpWheel(){if(WH.playing||!WH.queue.length||!WH.open)return;const rec=WH.queue.shift();const sp=M.spin;if(!sp||rec.gen!==sp.gen)return pumpWheel();
  const before=sp.players.filter(p=>!spinInfo().winners.slice(0,rec.n-1).includes(p));WH.playing=true;WH.cur={rec,players:before};
  const el=document.getElementById('wheelov');if(!el)return;
  const wrap=el.querySelector('.wheelwrap');if(wrap)wrap.innerHTML='<div class="wptr"></div>'+wheelSVG(before,0,'');
  const g=el.querySelector('#wg');const target=wheelTarget(before.length,rec.idx,rec.nonce);const dur=WH.reduced?200:3600;
  if(g){if(WH.reduced)g.style.transform='rotate('+(target%360)+'deg)';else{void g.getBoundingClientRect();g.style.transition='transform '+dur+'ms cubic-bezier(.12,.6,.1,1)';g.style.transform='rotate('+target+'deg)'}}
  const ww=el.querySelector('#wwin');if(ww)ww.textContent='🎡 …';vib([30]);
  setTimeout(()=>{WH.shown=rec.n;WH.playing=false;WH.cur=null;const e2=document.getElementById('wheelov');const w2=e2&&e2.querySelector('#wwin');
    if(w2)w2.textContent='🎉 '+wlabel(rec.winner)+' takes pick #'+rec.n+'!';
    setTimeout(()=>{if(!WH.playing){renderWheel();pumpWheel()}},WH.reduced?150:1100)},dur+150)}
async function writeSpin(rec){const url=spinKey(CFG.url,M.epoch,rec.gen,rec.n);
  for(let a=0;a<3;a++){let ex=null;try{ex=parseSpin(await readRaw(url))}catch(e){return null}
    const winners=spinReplay(M,SPIN).winners;
    if(ex&&ex.id!==rec.id&&spinValid(M,winners,ex)){SPIN[rec.n]=ex;SPINraw[rec.n]=JSON.stringify(ex);rebuild(true);return ex}   /* first valid record wins */
    if(!ex||ex.id!==rec.id){try{await postJ(url,rec)}catch(e){continue}}
    SPIN[rec.n]=rec;SPINraw[rec.n]=JSON.stringify(rec);rebuild(true);
    await sleep(500);try{const chk=parseSpin(await readRaw(url));if(chk&&chk.id===rec.id)return rec;if(chk&&spinValid(M,winners,chk)){SPIN[rec.n]=chk;SPINraw[rec.n]=JSON.stringify(chk);rebuild(true);return chk}}catch(e){return rec}}
  return null}
async function spinOne(){if(WH.busy||WH.playing||!needUnlock())return false;WH.busy=true;
  try{await pollOnce();
    if(!M.spin){const r=await simpleMeta(m=>mSpinStart(m),null,chk=>!!chk.spin);if(!r.ok)return false;await pollOnce()}
    let sp=spinInfo();if(sp.done){await lockSpin();return false}
    const rec=makeSpin(M,sp.winners,nowSrv());const w=await writeSpin(rec);if(!w){toast('⚠️ Could not save the spin — try again.');return false}
    sp=spinInfo();if(sp.done){await sleep(WH.reduced?600:4800);await lockSpin()}return true}
  finally{WH.busy=false}}
async function lockSpin(){const sp=spinInfo();const r=await mutateMeta(m=>mSpinLock(m,sp.winners),chk=>chk.orderLocked);if(r.ok)toast('🔒 Order locked!');else toast('⚠️ '+(r.msg||'Could not lock the order'));return r.ok}
async function spinAll(){if(WH.all)return;WH.all=true;renderWheel();
  while(WH.all){const ok=await spinOne();if(!ok)break;if(spinInfo().done)break;await sleep(WH.reduced?500:5200)}WH.all=false;renderWheel()}
const actRespin=()=>needUnlock()&&simpleMeta((m,st)=>mRespin(m,st,nowSrv()),'🎡 Order re-spun — spin again',chk=>!chk.orderLocked);
/* ===================== PRESENCE (who is online) =====================
   one key PER OWNER, written only by that owner's own device => concurrent heartbeats can never overwrite each other.
   30 s heartbeat (only while the tab is visible; one immediately on wake); 7 GETs per beat; online = seen within 75 s */
const PR={recs:{},busy:false,timer:null};
async function presBeat(){if(PR.busy||document.hidden||!M)return;PR.busy=true;
  try{const owner=(me&&!isSpec()&&ONAMES.indexOf(me)>=0)?me:null;
    if(owner){const t=nowSrv();try{await postJ(presenceKey(CFG.url,owner),{t,n:owner});PR.recs[owner]={t}}catch(e){}}
    await Promise.all(ONAMES.filter(o=>o!==owner).map(async o=>{try{const r=parsePresence(await readRaw(presenceKey(CFG.url,o)));if(r)PR.recs[o]=r}catch(e){}}))
  }finally{PR.busy=false;renderPresence()}}
function presTick(){clearInterval(PR.timer);PR.timer=null;if(!document.hidden)PR.timer=setInterval(presBeat,PRES.beatMs)}
function renderPresence(){const el=$('presence');if(!el)return;const owner=(me&&!isSpec()&&ONAMES.indexOf(me)>=0)?me:null;
  const v=presenceView(PR.recs,nowSrv(),owner,ONAMES);if(!v.online.length&&!v.away.length){el.hidden=true;el.innerHTML='';return}

};
document.addEventListener('click',e=>{if(e.target.closest('a.chip'))return;const el=e.target.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f){if(el.tagName==='INPUT'&&el.type==='checkbox'){f(el)}else f(el,e)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='w15')actFlags({warn15:el.checked});if(el.id==='atime')actFlags({autoTimeout:el.checked});if(el.id==='clk')actClock(+el.value);if(el.id==='simn')simN=+el.value;if(el.id==='tmode'||el.id==='tmodeP'){TF.mode=el.value;lsSet('tmode',TF.mode);updateTeams()}});
document.addEventListener('input',e=>{if(e.target.id==='tq'||e.target.id==='tqP'){TF.q=e.target.value;updateTeams()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pin'){e.preventDefault();(S&&S.pass&&document.querySelector('[data-a=dochpass]')?ACT.dochpass:ACT.dounlock)()}if(e.key==='Enter'&&e.target.id==='newpin'){e.preventDefault();ACT.setpass()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();ACT.send()}});
/* full refetch whenever the phone wakes up / comes back online (fixes stale board after screen lock) */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){kick();updateTitle();renderBanner();presBeat();syncTime()}else updateTitle();presTick()});
window.addEventListener('focus',()=>{kick();syncTime()});window.addEventListener('online',kick);window.addEventListener('pageshow',kick);
let lastTick=Date.now(),presT=0;
setInterval(()=>{const now=Date.now();if(now-lastTick>6000){kick();syncTime()}lastTick=now;if(now-srvSync>300000)syncTime();if(++presT%10===0)renderPresence();tickClock();autoTick();renderConn();
  },1000);
/* ===================== BOOT ===================== */
(async function boot(){
  const d0=embedded();loadFrom(d0.teams,d0.owners);dataSrc='embedded';          /* paint + start polling at once; the live data.json can only refine the list */
  if(window._asParam&&!me&&ONAMES.indexOf(window._asParam)>=0){me=window._asParam;lsSet('me',me)}
  loadLogCache();M=normalizeMeta(null,ONAMES);S=deriveState(M,{},{},POOLSET);S.logReady=false;renderAll();syncTime();
  if(!me)showIdentity();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}
  loop();presBeat();presTick();
  loadData().then(src=>{dataSrc=src;if(M)rebuild(true)}).catch(()=>{});
})();

</script>
