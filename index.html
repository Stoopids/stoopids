<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOOPIDS — NCAA Stoopids Pool</title>
<!--<FAVICON>--><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ffd23f%27/%3E%3Ctext x=%2732%27 y=%2749%27 font-family=%27Arial Black,Arial,sans-serif%27 font-size=%2748%27 font-weight=%27900%27 text-anchor=%27middle%27 fill=%27%23111%27%3ES%3C/text%3E%3C/svg%3E"><!--</FAVICON>-->
<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
header{max-width:1000px;margin:0 auto;padding:0 0 8px}
.hero{position:relative;aspect-ratio:992/340;background:url(assets/hero-wide.jpg?v=4) center 14%/cover no-repeat;border-radius:0 0 18px 18px;overflow:hidden}
.titlebar{padding:12px 14px 4px;text-align:left}
.titlebar .tag{margin:6px 0 0;color:#e7ecf6}
.fresh{display:flex;width:fit-content;max-width:100%;align-items:center;min-height:40px;margin:-6px 0 -8px;padding:6px 14px 6px 0;font-size:12px;line-height:1.3;color:var(--mut);opacity:.55;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.fresh[hidden]{display:none}
.fresh:hover{opacity:.85}
.fresh:focus-visible{opacity:.9;outline:1px dashed var(--mut);outline-offset:-2px;border-radius:6px}
.sub{padding:0 14px}
@media (max-width:640px){.hero{aspect-ratio:16/10;background-image:url(assets/hero-mobile.jpg?v=4);background-position:center 8%}}
h1{color:var(--acc);margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 span{color:var(--acc)}
.tag{color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin:8px 6px 0 0}
.badge.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
/*<NAV-ONE-ROW>*/
/* All tabs on ONE row, never wrapping or scrolling. Phone: tiny icon above a short label (full name stays in aria-label). Desktop (>=900px): full labels in pills. */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 4px;display:flex;flex-wrap:nowrap;gap:2px;overflow:hidden;max-width:1000px;margin:8px auto 0}
nav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer}
nav button .ni{font-size:17px;line-height:1}
nav button .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav button .nl.f{display:none}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:370px){nav{padding:6px 2px;gap:1px}nav button{font-size:8.8px;letter-spacing:-.025em}}
@media (min-width:900px){nav{padding:8px 10px;gap:5px}nav button{flex:1 1 auto;flex-direction:row;gap:6px;border-radius:99px;padding:8px 10px;min-height:40px;font-size:13px;letter-spacing:0}nav button .ni{font-size:14px}nav button .nl.f{display:block}nav button .nl.s{display:none}}
/*</NAV-ONE-ROW>*/
/*<DRAFT-TAB>*/
/* "Draft" is an external link (<a class="nd">) styled like the tab buttons. 10 items now: phone labels get shorter (see NAVSHORT below), full labels only from 1040px. */
nav a.nd{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px dashed var(--acc);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer;text-decoration:none}
nav a.nd .ni{font-size:17px;line-height:1}
nav a.nd .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav a.nd .nl.f{display:none}
nav a.nd:hover{background:var(--card2)}
nav a.nd:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:420px){nav{padding:6px 2px;gap:1px}}
@media (max-width:370px){nav a.nd{font-size:8.8px;letter-spacing:-.025em}}
@media (max-width:340px){nav button,nav a.nd{font-size:8.2px;letter-spacing:-.03em}}
@media (min-width:600px) and (max-width:1039px){nav{padding:6px 4px;gap:2px}nav button,nav a.nd{flex:1 1 0;flex-direction:column;gap:2px;border-radius:9px;padding:4px 0;min-height:46px;font-size:11.5px;letter-spacing:-.01em}nav button .ni,nav a.nd .ni{font-size:19px}nav button .nl.f,nav a.nd .nl.f{display:none}nav button .nl.s,nav a.nd .nl.s{display:block}}
@media (min-width:1040px){nav{padding:8px 8px;gap:3px}nav button,nav a.nd{flex:1 1 auto;flex-direction:row;gap:4px;border-radius:99px;padding:8px 8px;min-height:40px;font-size:12.5px;letter-spacing:0}nav button .ni,nav a.nd .ni{font-size:14px}nav button .nl.f,nav a.nd .nl.f{display:block}nav button .nl.s,nav a.nd .nl.s{display:none}}
/*</DRAFT-TAB>*/
main{max-width:1000px;margin:0 auto;padding:12px 10px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}
.rank{font-size:26px;font-weight:900;width:46px;text-align:center;color:var(--acc)}
.who{flex:1;min-width:0}
.who b{font-size:17px}
.who small{display:block;color:var(--mut)}
.pts{font-size:28px;font-weight:900;text-align:right}
.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:#1e293b;font-size:9px;font-weight:900;letter-spacing:-.02em;line-height:1}
.chip.big .nologo{font-size:11px}
.chip:hover{filter:brightness(1.12)}
/*<RANK-CHIPS>*/
/* Ranks tab (tidy): every card is the same height. Phones (<700px): row 1 = rank | name + team-name subtitle | points, then an equal-width chip grid (4 columns, 3 below 340px, rows fixed at 32px). Team names wrap to 2 lines inside the chip instead of being cut off. >=700px (RANK-BESIDE below): rank | name | points | chips as true columns shared by all cards (CSS subgrid), so points and chips line up vertically. Markup: cards wrapped in .ocl, chip name in span.cn. Links/JS unchanged. */
.card.oc{display:grid;grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"rank who pts" "bar bar bar" "chips chips chips";column-gap:10px;align-items:center}
.card.oc .lb{display:contents}
.card.oc .rank{grid-area:rank}
.card.oc .who{grid-area:who}
.card.oc .pts{grid-area:pts}
.card.oc .bar{grid-area:bar}
.card.oc .chips{grid-area:chips;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:32px;gap:4px;margin-top:8px;align-self:stretch;--rows:2;min-height:calc(var(--rows)*32px + (var(--rows) - 1)*4px);align-content:start}
.card.oc .chip{display:flex;align-items:center;gap:3px;min-width:0;max-width:none;height:32px;box-sizing:border-box;padding:0 3px 0 2px;font-size:9.5px;letter-spacing:-.02em;line-height:1.1;overflow:hidden}
.card.oc .chip img,.card.oc .chip .nologo{width:17px;height:17px;margin:0;flex:none;padding:1px}
.card.oc .chip .nologo{font-size:7px}
.card.oc .chip .cn{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;text-align:left}
.card.oc .chip .cn.one{display:block;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:339px){.card.oc .chips{grid-template-columns:repeat(3,minmax(0,1fr));--rows:3}}
/*</RANK-CHIPS>*/
/*<RANK-BESIDE>*/
/* >=700px only: one shared 4-column track set (rank | name | points | chips) for the whole list via subgrid, so names, points and chip grids line up in every card; name column is as wide as the longest name (max 230px), points column right-aligned. */
@media (min-width:700px){
  .ocl{display:grid;grid-template-columns:56px fit-content(230px) auto minmax(0,1fr);column-gap:12px;margin-top:10px}
  .ocl>.card.oc{grid-column:1/-1;grid-template-columns:56px 200px 64px minmax(0,1fr);grid-template-areas:"rank who pts chips" "bar bar bar bar";column-gap:12px}
  @supports (grid-template-columns:subgrid){.ocl>.card.oc{grid-template-columns:subgrid}}
  .card.oc .pts{justify-self:end;text-align:right}
  .card.oc .chips{margin-top:0}
  .card.oc .bar{margin-top:8px}
  .card.oc .chip{font-size:11.5px;letter-spacing:0;padding:0 6px 0 2px;gap:4px}
  .card.oc .chip img,.card.oc .chip .nologo{width:20px;height:20px}
  .ocl>.card.oc{margin:0 0 10px}
}
@media (min-width:1000px){.card.oc .chip{font-size:12.5px}}
/*</RANK-BESIDE>*/
.chip.big{font-size:15px;padding:3px 11px 3px 3px}
.chip.big img{width:30px;height:30px}
.chip.out{opacity:.55;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto;overflow-wrap:normal;background-color:var(--card);background-image:linear-gradient(90deg,var(--card) 30%,rgba(26,31,43,0)),linear-gradient(270deg,var(--card) 30%,rgba(26,31,43,0)),linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0)),linear-gradient(270deg,rgba(0,0,0,.6),rgba(0,0,0,0));background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;background-size:28px 100%,28px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}
.swipe{display:none;font-size:12px;color:var(--mut);margin:4px 2px 0}
@media (max-width:640px){.swipe{display:block}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 13px;min-height:40px;cursor:pointer;font-weight:600}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.trow{cursor:pointer}
.det{background:var(--card2);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;margin:2px 3px 2px 0}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--mut)}
ul.it{margin:6px 0;padding-left:18px}
ul.it li{margin:2px 0}
.quip{color:var(--acc);font-style:italic;margin:6px 0 0}
h2{font-size:19px;margin:18px 0 6px}
.note{overflow-wrap:anywhere;font-size:13px;color:var(--mut)}
select,.sel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:40px;font:inherit}
.gday{margin:16px 2px 4px;font-weight:800;color:var(--acc)}
.gm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.gm.h2h{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.gm .gh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.gside{display:flex;align-items:center;gap:8px;padding:4px 0}
.gside .nm{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gside .sc2{font-size:22px;font-weight:900;min-width:34px;text-align:right}
.gside.lose .sc2{color:var(--mut);font-weight:700}
.opill{display:inline-block;padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.opill.none{opacity:.5}
.gl{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13px}
.up{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:#7c2d12;color:#ffedd5}
.up.ns{background:var(--card2);color:var(--mut)}
.h2b{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:var(--acc);color:#111}
.seed{font-size:11px;color:var(--mut)}

.sb-in,.sb-ta{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:100%}
.sb-ta{min-height:70px}
.row2{display:flex;flex-wrap:wrap;gap:8px}.row2>*{flex:1 1 150px}
label.k{display:inline-flex;align-items:center;gap:4px;margin:3px 8px 3px 0;font-size:14px}
.btn{background:var(--acc);color:#111;border:0;border-radius:10px;padding:11px 14px;min-height:40px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.st{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid var(--line);background:var(--card2)}
.st.open{color:#7dd3fc}.st.settled{color:var(--good)}.st.wash{color:var(--mut)}.st.unparsed{color:#fbbf24;border-color:#8a6d12}
.mx td,.mx th{padding:5px 7px;font-size:13px;text-align:right;white-space:nowrap}.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx td.z{color:#4b566d}
pre.js{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.agrid .card{margin:0}
.agrid td.t{word-break:break-word}
.arow-champ td{background:rgba(255,210,63,.08)}
.crown{margin-left:4px}
.asel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px}
.asel select{font-size:16px;font-weight:700;min-width:190px}
.fine{font-size:12px;color:var(--mut)}
.pill.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
footer{max-width:1000px;margin:0 auto;padding:0 14px 40px;color:var(--mut);font-size:12px}

/* ---------- "Who are you?" modal (the online list now lives in the chat bar) ---------- */
/* the old standalone 'Online now' strip CSS (#presence/.pr/.pc/.pg) was removed: that info now lives in the merged chat bar (CHAT-BAR) */
.pwho{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.78);display:flex;align-items:center;justify-content:center;padding:14px}
.pwho .box{width:100%;max-width:360px;max-height:100%;overflow:auto;background:var(--card);border:2px solid var(--acc);border-radius:18px;padding:16px 14px 14px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.55)}
.pwho h2{margin:0;color:var(--acc);font-size:24px;font-weight:900}
.pwho p{margin:6px 0 12px;color:var(--mut);font-size:13.5px}
.pwho .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pwho button{font:inherit;font-weight:800;font-size:14px;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;cursor:pointer;min-width:0;line-height:1.15}
.pwho button:active,.pwho button:hover{border-color:var(--acc);color:var(--acc)}
.pwho button.cur{background:var(--acc);color:#111;border-color:var(--acc)}
.pwho button.guest{width:100%;margin-top:9px;background:transparent;border-style:dashed;color:var(--mut);font-weight:700}
.pwho .skip{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);font-size:12.5px;font-weight:600;text-decoration:underline;padding:4px}
/*<NEWBET-CSS>*/
.nbt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:calc(100% - 20px);max-width:420px;display:flex;align-items:center;gap:6px;background:var(--card2);color:var(--tx);border:1px solid var(--acc);border-radius:14px;padding:6px 6px 6px 12px;box-shadow:0 8px 28px rgba(0,0,0,.55);font-size:14px;font-weight:700}
.nbt[hidden]{display:none}
.nbt .nbm{flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.3}
.nbt button{flex:none;min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:13px;font-weight:800;cursor:pointer;padding:0 10px}
.nbt .nbv{background:var(--acc);color:#111;border-color:var(--acc)}
body.chatopen .nbt{bottom:auto;top:64px}
nav button .nb{position:absolute;top:1px;right:2px;background:var(--acc);color:#111;border-radius:99px;font-size:9px;font-weight:900;line-height:1;padding:2px 4px;pointer-events:none}
/*</NEWBET-CSS>*/
/*<CHAT-CSS>*/
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chat{max-width:1000px;margin:0 auto 18px;padding:0 10px}
.chat[hidden]{display:none}
/*<CHAT-BAR>*/
.chat-t{display:flex;align-items:center;gap:8px;width:100%;min-height:54px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;padding:6px 12px;cursor:pointer;text-align:left}
.chat.top{margin-top:10px}
.cbm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cb1,.cb2{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb1{font-size:12px;font-weight:700;color:var(--mut);line-height:1.25}
.cb1 .cbo{color:var(--tx);margin-right:9px;white-space:nowrap}
.cb1 .cbf,.cb1 .cbg{color:var(--mut);font-weight:600;margin-right:9px;white-space:nowrap}
.cb1 .pd{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 2px rgba(74,222,128,.22);margin-right:4px;vertical-align:0}
.cb2{font-size:13.5px;font-weight:600;color:#c3cbdc;line-height:1.3}
.cb2.un{color:var(--tx);font-weight:800}
.cb2.ty{color:var(--acc);font-weight:700;font-style:italic}
.cb2.mut{color:var(--mut);font-weight:500}
.chat-t .cdot{flex:none;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:#ff3b5c;color:#fff;font-size:14px;font-weight:900;font-style:normal;line-height:26px;text-align:center;box-shadow:0 0 0 3px rgba(255,59,92,.3)}
.chat-t .cdot[hidden]{display:none}
.chat.unread .chat-t{border-color:var(--acc);background:#2b2510;animation:cbpulse 2.2s ease-in-out infinite}
@keyframes cbpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,0)}50%{box-shadow:0 0 0 5px rgba(255,210,63,.32),0 0 16px rgba(255,210,63,.3)}}
@media (prefers-reduced-motion:reduce){.chat.unread .chat-t{animation:none;box-shadow:0 0 0 3px rgba(255,210,63,.5)}}
.chat-h{display:flex;gap:6px;align-items:center;justify-content:space-between;margin:0 0 6px}
.chat-h button{min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chat-h button[aria-pressed=true]{color:var(--acc);border-color:var(--acc)}
.chat-h button[hidden]{display:none}
nav button.hasu .nb{font-size:0;padding:0;width:9px;height:9px;top:3px;right:3px}   /* chat count present: the existing 'new' bet pill shrinks to a dot so the two never overlap */

/* If a concurrent writer overwrote one of MY recent saves (last-write-wins store), put it back on the next poll. */
async function sharedHeal(d){
  const now=Date.now();SH.mine=SH.mine.filter(m=>now-m.t<15*60e3);
  const miss=SH.mine.filter(m=>!m.verify(d));
  if(!miss.length||SH.busy)return d;
  SH.busy=true;
  for(const m of miss){
    try{d=await sharedWrite(m.mutate,m.verify)}catch(e){SH.mine=SH.mine.filter(x=>x!==m);if(e.net)break}
  }
  SH.busy=false;return d;
}

/* ===== POOL (Bets 26-27): a group entry where each participant gets some back when it is done. ONE record in the same ledger key: {id,n,kind:'pool',backer:<who built it>,parts:[names],amt:<buy-in each>,back:null|{name:amount},text,created_at,status:'open'|'void',settled_at}.
   Counts as soon as the amounts back are entered (they must add up to buy-in x participants); each person's net = back - buy-in. Blank = open, entered later on the card. ===== */
/* ALL Pool wording lives here (the old Side bets pool form's own text; swap the wording in this one place). {x} = filled in by PT(). */
const POOL_TXT={
  toggle:'Pool / buy-in', toggleBet:'One side vs another',
  intro:'Fill in the terms, hit "Build". Leave the result blank for an open bet; settle it later below.',
  terms:'Terms, in words (e.g. Kurmoji bets Ken 100K that Duke covers -4.5)',
  participants:'Participants', youIn:'(you are in automatically)',
  fBuy:'Buy-in each: 250K', fPay:'Payouts when done (total received), e.g. kurt:800K, mark:1.2mil',
  help:'Winner and runner-up money-back are just payouts (e.g. winner 1mil, 2nd 200K back). Payouts must add up to the pot. Use these short names for payouts: {keys}',
  build:'Build',
  eMe:'Pick who you are first.', eTerms:'Write the terms of the pool first.', ePeople:'a pool needs 2+ participants', eBuy:'pool needs a buy-in like 250K',
  eBuyMin:'buy-in must be a whole number of at least {min} (like 250K)', eBadPay:"can't read one of the payouts (try 800K, 1.2mil)", eFmt:'Write each payout as name:amount, like kurt:800K.',
  eSum:'payouts add up to {sum} but the pot is {total}', eUnknown:'Unknown name "{x}". Use these short names for payouts: {keys}', eNotIn:'"{x}" is not in this pool.', eDup:'"{x}" is listed twice.', eEmptyPay:'Fill in the payouts first.',
  confirmTitle:'Check it, then confirm', sum:'Pool of {names} · buy-in {buy} each · total {tot}', open:'Payouts left open: it stays open until someone fills them in below.',
  row:'{name}: gets {got}, net {net}', settleUp:'{from} owes {to} {n}', go:'✅ Yes, build it', change:'← Change',
  placed:'Built! Pool #{n} is open until the payouts are entered. You can undo it for 30 seconds.', placedDone:'Built! Pool #{n} counts now. You can undo it for 30 seconds.',
  word:'Pool', stOpen:'Open', stDone:'Settled', stVoid:'Cancelled', who:'{n} managers', with:'With: {names}',
  line:'Buy-in each {buy} · total {tot}', noPay:'Payouts not entered yet.',
  save:'Save payouts', again:'Tap again to confirm', cancel:'Cancel this pool', undo:'↩ Undo this pool (30 s)', adminCancel:'Cancel pool (admin)', result:'Result',
  already:'Already settled.', saved:'Saved.',
  tHead:'Pool settle-up', tNote:'From each settled pool, the biggest loser owes the biggest winner, then the next. Net per manager includes pools.', tTag:'Pool #{n}: {text}',
  toast:'{who} just built a pool with {names}', cantSave:'Couldn’t save. Check your connection and tap Build again (it won’t double-post).'
};
const PT=(k,v)=>String(POOL_TXT[k]).replace(/\{(\w+)\}/g,(_,n)=>v&&n in v?v[n]:'');
const POOL_MAX=1e9;
const b27Key=n=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,'');
function b27PoolKeys(names){const m={};names.forEach(n=>{const w=String(n).split(/\s+/).filter(Boolean);m[n]=b27Key(w[w.length-1]||n)});const c={};Object.values(m).forEach(k=>c[k]=(c[k]||0)+1);names.forEach(n=>{if(c[m[n]]>1)m[n]=b27Key(n)});return m}
const b27PoolKeyList=()=>{const ns=b27OwnerNames(),k=b27PoolKeys(ns);return ns.map(n=>k[n]).join(', ')};
/* amounts: the old form's own shorthand (K / mil / juta ...) via parseAmount, but a bare number stays as typed ("50" = 50); whole numbers only */
function b27PoolNum(s){const v=parseAmount(String(s==null?'':s).trim(),false);return v!==null&&Number.isInteger(v)&&v>=0&&v<=POOL_MAX?v:null}
/* parts = everybody in the pool; buyTxt = entry each text; txt = amounts-back text. -> {ok,err} or {ok:true,amt,back:null|{name:n}} */
function b27PoolParse(parts,buyTxt,txt){
  if(parts.length<2)return {ok:false,err:PT('ePeople')};
  if(!String(buyTxt==null?'':buyTxt).trim())return {ok:false,err:PT('eBuy')};
  const amt=b27PoolNum(buyTxt);if(amt===null||amt<PULK.minAmt)return {ok:false,err:amt===null&&parseAmount(String(buyTxt).trim(),false)===null?PT('eBuy'):PT('eBuyMin',{min:PULK.minAmt})};
  const sz=amt*parts.length;let back=null;
  if(String(txt==null?'':txt).trim()){
    const names=b27OwnerNames(),keys=b27PoolKeys(names);back={};
    for(const raw of String(txt).split(/[,;\n]+/)){const x=raw.trim();if(!x)continue;const i=x.search(/[:=]/);if(i<1)return {ok:false,err:PT('eFmt')};
      const k=b27Key(x.slice(0,i)),vv=x.slice(i+1).trim();
      const hit=names.filter(n=>keys[n]===k||b27Key(n)===k||b27Key(String(n).split(/\s+/)[0])===k);
      if(hit.length!==1)return {ok:false,err:PT('eUnknown',{x:x.slice(0,i).trim(),keys:b27PoolKeyList()})};
      const who=hit[0];if(!parts.includes(who))return {ok:false,err:PT('eNotIn',{x:who})};
      if(Object.prototype.hasOwnProperty.call(back,who))return {ok:false,err:PT('eDup',{x:who})};
      const v=b27PoolNum(vv);if(v===null)return {ok:false,err:PT('eBadPay')};back[who]=v}
    for(const p of parts)if(!Object.prototype.hasOwnProperty.call(back,p))back[p]=0;
    const tot=parts.reduce((s,p)=>s+back[p],0);if(tot!==sz)return {ok:false,err:PT('eSum',{sum:b27Num(tot),total:b27Num(sz)})};
  }
  return {ok:true,amt,back};
}
/* settle-up from nets [[name,net],...] (sum 0): the biggest loser owes the biggest winner, repeat */
function b27Greedy(nets){const d=nets.filter(x=>x[1]<0).map(x=>[x[0],-x[1]]),c=nets.filter(x=>x[1]>0).map(x=>[x[0],x[1]]),out=[];const srt=a=>a.sort((p,q)=>q[1]-p[1]||p[0].localeCompare(q[0]));
  while(d.length&&c.length){srt(d);srt(c);const m=Math.min(d[0][1],c[0][1]);out.push({from:d[0][0],to:c[0][0],num:m});d[0][1]-=m;c[0][1]-=m;if(!d[0][1])d.shift();if(!c[0][1])c.shift()}
  return out}
const b27PoolNets=b=>b.parts.map(p=>[p,((b.back&&b.back[p])||0)-b.amt]);
function b27PoolValid(x,names){
  const n=Number(x.n),t=Date.parse(x.created_at),amt=Number(x.amt),backer=legacyOwner(x.backer),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  if(typeof x.id!=='string'||!/^[a-z0-9]{6,24}$/.test(x.id)||!Array.isArray(x.parts)||typeof x.text!=='string')return null;
  const parts=x.parts.map(legacyOwner);
  if(parts.length<2||parts.length>names.length||parts.some(p=>typeof p!=='string'||!names.includes(p))||new Set(parts).size!==parts.length||!parts.includes(backer))return null;
  if(!Number.isInteger(amt)||amt<PULK.minAmt||amt>POOL_MAX||!Number.isInteger(n)||n<1||!isFinite(t))return null;
  let back=null;
  if(x.back&&typeof x.back==='object'&&!Array.isArray(x.back)){const raw={};for(const k of Object.keys(x.back))raw[legacyOwner(k)]=x.back[k];const bk={};let ok=true;
    for(const k of Object.keys(raw)){if(!parts.includes(k)||!Number.isInteger(raw[k])||raw[k]<0||raw[k]>POOL_MAX)ok=false;else bk[k]=raw[k]}
    if(ok){parts.forEach(p=>{if(!has(bk,p))bk[p]=0});if(parts.reduce((s,p)=>s+bk[p],0)===amt*parts.length)back=bk}}
  return {id:x.id,n,kind:'pool',backer,parts,amt,back,text:b27Clean(x.text),created_at:new Date(t).toISOString(),status:['open','void'].includes(x.status)?x.status:'open',settled_at:x.settled_at&&isFinite(Date.parse(x.settled_at))?new Date(x.settled_at).toISOString():null};
}
