<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
header{max-width:1000px;margin:0 auto;padding:0 0 8px}
.hero{position:relative;aspect-ratio:992/340;background:url(assets/hero-wide.jpg?v=4) center 14%/cover no-repeat;border-radius:0 0 18px 18px;overflow:hidden}
.titlebar{padding:12px 14px 4px;text-align:left}
.titlebar .tag{margin:6px 0 0;color:#e7ecf6}
.fresh{display:flex;width:fit-content;max-width:100%;align-items:center;min-height:40px;margin:-6px 0 -8px;padding:6px 14px 6px 0;font-size:12px;line-height:1.3;color:var(--mut);opacity:.55;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.fresh[hidden]{display:none}
.fresh:hover{opacity:.85}
.fresh:focus-visible{opacity:.9;outline:1px dashed var(--mut);outline-offset:-2px;border-radius:6px}
.sub{padding:0 14px}
@media (max-width:640px){.hero{aspect-ratio:16/10;background-image:url(assets/hero-mobile.jpg?v=4);background-position:center 8%}}
h1{color:var(--acc);margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 span{color:var(--acc)}
.tag{color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin:8px 6px 0 0}
.badge.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
/*<NAV-ONE-ROW>*/
/* All tabs on ONE row, never wrapping or scrolling. Phone: tiny icon above a short label (full name stays in aria-label). Desktop (>=900px): full labels in pills. */
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 4px;display:flex;flex-wrap:nowrap;gap:2px;overflow:hidden;max-width:1000px;margin:8px auto 0}
nav button{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer}
nav button .ni{font-size:17px;line-height:1}
nav button .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav button .nl.f{display:none}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:370px){nav{padding:6px 2px;gap:1px}nav button{font-size:8.8px;letter-spacing:-.025em}}
@media (min-width:900px){nav{padding:8px 10px;gap:5px}nav button{flex:1 1 auto;flex-direction:row;gap:6px;border-radius:99px;padding:8px 10px;min-height:40px;font-size:13px;letter-spacing:0}nav button .ni{font-size:14px}nav button .nl.f{display:block}nav button .nl.s{display:none}}
/*</NAV-ONE-ROW>*/
/*<DRAFT-TAB>*/
/* "Draft" is an external link (<a class="nd">) styled like the tab buttons. 10 items now: phone labels get shorter (see NAVSHORT below), full labels only from 1040px. */
nav a.nd{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--card);color:var(--tx);border:1px dashed var(--acc);border-radius:9px;padding:4px 0;min-height:46px;font:inherit;font-size:9.5px;font-weight:800;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;cursor:pointer;text-decoration:none}
nav a.nd .ni{font-size:17px;line-height:1}
nav a.nd .nl{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
nav a.nd .nl.f{display:none}
nav a.nd:hover{background:var(--card2)}
nav a.nd:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media (max-width:420px){nav{padding:6px 2px;gap:1px}}
@media (max-width:370px){nav a.nd{font-size:8.8px;letter-spacing:-.025em}}
@media (max-width:340px){nav button,nav a.nd{font-size:8.2px;letter-spacing:-.03em}}
@media (min-width:600px) and (max-width:1039px){nav{padding:6px 4px;gap:2px}nav button,nav a.nd{flex:1 1 0;flex-direction:column;gap:2px;border-radius:9px;padding:4px 0;min-height:46px;font-size:11.5px;letter-spacing:-.01em}nav button .ni,nav a.nd .ni{font-size:19px}nav button .nl.f,nav a.nd .nl.f{display:none}nav button .nl.s,nav a.nd .nl.s{display:block}}
@media (min-width:1040px){nav{padding:8px 8px;gap:3px}nav button,nav a.nd{flex:1 1 auto;flex-direction:row;gap:4px;border-radius:99px;padding:8px 8px;min-height:40px;font-size:12.5px;letter-spacing:0}nav button .ni,nav a.nd .ni{font-size:14px}nav button .nl.f,nav a.nd .nl.f{display:block}nav button .nl.s,nav a.nd .nl.s{display:none}}
/*</DRAFT-TAB>*/
main{max-width:1000px;margin:0 auto;padding:12px 10px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;overflow-wrap:anywhere}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}
.rank{font-size:26px;font-weight:900;width:46px;text-align:center;color:var(--acc)}
.who{flex:1;min-width:0}
.who b{font-size:17px}
.who small{display:block;color:var(--mut)}
.who .gold{display:block;font-size:12px;line-height:1.3;color:var(--mut);font-weight:400;white-space:nowrap;letter-spacing:1px}
.pts{font-size:28px;font-weight:900;text-align:right}
.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{text-decoration:none;display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-flex;align-items:center;justify-content:center;background:#e2e8f0;color:#1e293b;font-size:9px;font-weight:900;letter-spacing:-.02em;line-height:1}
.chip.big .nologo{font-size:11px}
.chip:hover{filter:brightness(1.12)}
/*<RANK-CHIPS>*/
/* Ranks tab (tidy): every card is the same height. Phones (<700px): row 1 = rank | name + team-name subtitle | points, then an equal-width chip grid (4 columns, 3 below 340px, rows fixed at 32px). Team names wrap to 2 lines inside the chip instead of being cut off. >=700px (RANK-BESIDE below): rank | name | points | chips as true columns shared by all cards (CSS subgrid), so points and chips line up vertically. Markup: cards wrapped in .ocl, chip name in span.cn. Links/JS unchanged. */
.card.oc{display:grid;grid-template-columns:46px minmax(0,1fr) auto;grid-template-areas:"rank who pts" "bar bar bar" "chips chips chips";column-gap:10px;align-items:center}
.card.oc .lb{display:contents}
.card.oc .rank{grid-area:rank}
.card.oc .who{grid-area:who}
.card.oc .pts{grid-area:pts}
.card.oc .bar{grid-area:bar}
.card.oc .chips{grid-area:chips;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:32px;gap:4px;margin-top:8px;align-self:stretch;--rows:2;min-height:calc(var(--rows)*32px + (var(--rows) - 1)*4px);align-content:start}
.card.oc .chip{display:flex;align-items:center;gap:3px;min-width:0;max-width:none;height:32px;box-sizing:border-box;padding:0 3px 0 2px;font-size:9.5px;letter-spacing:-.02em;line-height:1.1;overflow:hidden}
.card.oc .chip img,.card.oc .chip .nologo{width:17px;height:17px;margin:0;flex:none;padding:1px}
.card.oc .chip .nologo{font-size:7px}
.card.oc .chip .cn{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:normal;word-break:normal;text-align:left}
.card.oc .chip .cn.one{display:block;white-space:nowrap;text-overflow:ellipsis}
@media (max-width:339px){.card.oc .chips{grid-template-columns:repeat(3,minmax(0,1fr));--rows:3}}
/*</RANK-CHIPS>*/
/*<WHO-CENTER>*/@media (max-width:600px){.card.oc .who{text-align:center;overflow-wrap:anywhere}.card.oc .who small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}/*</WHO-CENTER>*/

/*<QB-BOLT>*/.qb-bolt{display:inline-block;vertical-align:-.125em;flex:none;margin-right:.35em}/*</QB-BOLT>*/
/*<RANK-BESIDE>*/
/* >=700px only: one shared 4-column track set (rank | name | points | chips) for the whole list via subgrid, so names, points and chip grids line up in every card; name column is as wide as the longest name (max 230px), points column right-aligned. */
@media (min-width:700px){
  .ocl{display:grid;grid-template-columns:56px fit-content(230px) auto minmax(0,1fr);column-gap:12px;margin-top:10px}
  .ocl>.card.oc{grid-column:1/-1;grid-template-columns:56px 200px 64px minmax(0,1fr);grid-template-areas:"rank who pts chips" "bar bar bar bar";column-gap:12px}
  @supports (grid-template-columns:subgrid){.ocl>.card.oc{grid-template-columns:subgrid}}
  .card.oc .pts{justify-self:end;text-align:right}
  .card.oc .chips{margin-top:0}
  .card.oc .bar{margin-top:8px}
  .card.oc .chip{font-size:11.5px;letter-spacing:0;padding:0 6px 0 2px;gap:4px}
  .card.oc .chip img,.card.oc .chip .nologo{width:20px;height:20px}
  .ocl>.card.oc{margin:0 0 10px}
}
@media (min-width:1000px){.card.oc .chip{font-size:12.5px}}
/*</RANK-BESIDE>*/
/*<CHIP-RECORD>*/
/* Standings chips: the team's W-L (data.json "records": completed regular-season + conference games, same number as the Teams tab) sits inside the chip on its own small line under the school name (logo spans both lines). Chip rows are 40px instead of 32px to make room. A team with no completed game is not in "records" and shows 0-0; if the data has no "records" key at all, no record is shown. */
.card.oc .chips{grid-auto-rows:40px;min-height:calc(var(--rows)*40px + (var(--rows) - 1)*4px)}
.card.oc .chip{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;align-content:center;align-items:center;column-gap:3px;row-gap:0;height:40px}
.card.oc .chip img,.card.oc .chip .nologo{grid-row:1/3;align-self:center}
.card.oc .chip .cn{grid-column:2}
.card.oc .chip .cr{grid-column:2;display:block;font-size:.92em;font-weight:600;line-height:1.1;letter-spacing:0;white-space:nowrap;font-variant-numeric:tabular-nums;opacity:.85;text-align:left;margin-top:1px}
.card.oc .chip .cn.one{align-self:end}
/*</CHIP-RECORD>*/
/*<CHIP-FIT>*/
/* Standings chips: the school name stays on ONE line (never wraps). chipFit() (JS, after every render / resize) shrinks the name font a step at a time until it fits the chip (floor 9px); only a name that still does not fit at 9px is cut with an ellipsis (the whole chip link title and the text keep the full name). Chip size / width / height unchanged. */
.card.oc .chip .cn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/*</CHIP-FIT>*/
.chip.big{font-size:15px;padding:3px 11px 3px 3px}
.chip.big img{width:30px;height:30px}
.chip.out{opacity:.55;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}

.sc{overflow-x:auto;overflow-wrap:normal;background-color:var(--card);background-image:linear-gradient(90deg,var(--card) 30%,rgba(26,31,43,0)),linear-gradient(270deg,var(--card) 30%,rgba(26,31,43,0)),linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,0)),linear-gradient(270deg,rgba(0,0,0,.6),rgba(0,0,0,0));background-position:0 0,100% 0,0 0,100% 0;background-repeat:no-repeat;background-size:28px 100%,28px 100%,12px 100%,12px 100%;background-attachment:local,local,scroll,scroll}

.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px 13px;min-height:40px;cursor:pointer;font-weight:600}

/*<ONE-BETS>*/.ob-seg{flex-wrap:nowrap;gap:0;max-width:440px}.ob-seg button{flex:1 1 0;min-width:0;position:relative;border-radius:0;white-space:nowrap;padding:10px 6px}.ob-seg button:first-child{border-radius:10px 0 0 10px}.ob-seg button:last-child{border-radius:0 10px 10px 0;margin-left:-1px}.ob-seg button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:800}.ob-seg .nb{position:absolute;top:-5px;right:6px;background:var(--acc);color:#111;border-radius:99px;font-size:9px;font-weight:900;line-height:1;padding:2px 5px;pointer-events:none}/*</ONE-BETS>*/
.trow{cursor:pointer}

.qb-pick{margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);font-size:13px}.qb-pick .qb-r{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}.qb-pick .qb-l{font-weight:800}.qb-pick .qb-r.v{display:block}.qb-pick .qb-r.v .qb-l{display:block;margin-bottom:4px;font-size:12px;color:var(--mut)}.qb-pick .qb-g{display:flex;gap:6px}.qb-pick .qb-g button{flex:1 1 0;min-width:0}.qb-pick .qb-g.w{flex-wrap:wrap}.qb-pick .qb-g.w button{flex:1 1 auto}.b27-form{scroll-margin-top:84px}

/* ---------- "Who are you?" modal (the online list now lives in the chat bar) ---------- */
/* the old standalone 'Online now' strip CSS (#presence/.pr/.pc/.pg) was removed: that info now lives in the merged chat bar (CHAT-BAR) */

  while(d.length&&c.length){srt(d);srt(c);const m=Math.min(d[0][1],c[0][1]);out.push({from:d[0][0],to:c[0][0],num:m});d[0][1]-=m;c[0][1]-=m;if(!d[0][1])d.shift();if(!c[0][1])c.shift()}
  return out}
const b27PoolNets=b=>b.parts.map(p=>[p,((b.back&&b.back[p])||0)-b.amt]);
function b27PoolValid(x,names){
  const n=Number(x.n),t=Date.parse(x.created_at),amt=Number(x.amt),backer=legacyOwner(x.backer),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
  if(typeof x.id!=='string'||!/^[a-z0-9]{6,24}$/.test(x.id)||!Array.isArray(x.parts)||typeof x.text!=='string')return null;
  const parts=x.parts.map(legacyOwner);
  if(parts.length<2||parts.length>names.length||parts.some(p=>typeof p!=='string'||!names.includes(p))||new Set(parts).size!==parts.length||!parts.includes(backer))return null;
  if(!Number.isInteger(amt)||amt<PULK.minAmt||amt>POOL_MAX||!Number.isInteger(n)||n<1||!isFinite(t))return null;
  let back=null;
  if(x.back&&typeof x.back==='object'&&!Array.isArray(x.back)){const raw={};for(const k of Object.keys(x.back))raw[legacyOwner(k)]=x.back[k];const bk={};let ok=true;
    for(const k of Object.keys(raw)){if(!parts.includes(k)||!Number.isInteger(raw[k])||raw[k]<0||raw[k]>POOL_MAX)ok=false;else bk[k]=raw[k]}
    if(ok){parts.forEach(p=>{if(!has(bk,p))bk[p]=0});if(parts.reduce((s,p)=>s+bk[p],0)===amt*parts.length)back=bk}}
  return {id:x.id,n,kind:'pool',backer,parts,amt,back,text:b27Clean(x.text),created_at:new Date(t).toISOString(),status:['open','void'].includes(x.status)?x.status:'open',settled_at:x.settled_at&&isFinite(Date.parse(x.settled_at))?new Date(x.settled_at).toISOString():null/*<S25C-RX>*/,...(s25ValidExtra(x,names,'open').rx?{rx:s25ValidExtra(x,names,'open').rx}:{})/*</S25C-RX>*/};
}

function s24ValidExtra(x,status,opps){
  const o={},rid=v=>typeof v==='string'&&/^[a-z0-9]{6,24}$/.test(v),nm=v=>typeof v==='string'&&(v===x.backer||opps.includes(v)),sd=v=>v===x.backer?'b':'o',ts=v=>v&&isFinite(Date.parse(v))?new Date(v).toISOString():null;
  if(rid(x.ed))o.ed=x.ed;
  if(rid(x.edTo)&&status==='void')o.edTo=x.edTo;
  if(Array.isArray(x.fxh)){const h=x.fxh.filter(e=>e&&typeof e==='object'&&rid(e.i)&&nm(e.by)&&S24R.includes(e.r)&&S24R.includes(e.from)&&e.r!==e.from&&['confirmed','declined','withdrawn','replaced'/*<CREATOR-SETTLE>*/,'fixed'/*</CREATOR-SETTLE>*/].includes(e.out)&&(e.out==='confirmed'||e.out==='declined'?nm(e.ans)&&sd(e.ans)!==sd(e.by):/*<CREATOR-SETTLE>*/e.out==='fixed'?e.by===x.backer&&!e.ans:/*</CREATOR-SETTLE>*/!e.ans)).slice(-20)
      .map(e=>Object.assign({i:e.i,by:e.by,from:e.from,r:e.r,at:ts(e.at),out:e.out},e.ans?{ans:e.ans}:{},{at2:ts(e.at2)}));if(h.length)o.fxh=h}
  if(x.fx&&typeof x.fx==='object'&&S24R.includes(status)){const f=x.fx;if(rid(f.i)&&nm(f.by)&&S24R.includes(f.r)&&f.r!==status)o.fx={i:f.i,by:f.by,r:f.r,at:ts(f.at)}}
  return o}
/* pure: apply one fix event by `me` to bet b. Returns {b:newRecord|null, ok, err}. null = nothing to do (already done, not allowed, stale). */
/*<CREATOR-SETTLE>*//* creator-only (Paul's rule): the creator fixes the result directly (history entry out:'fixed'); a request left open by the old two-side flow can be confirmed or declined by the creator only; nobody else can change anything */
function s24FixApply(b,me,op,a,at){
  if(!b||b.kind==='pool'||!S24R.includes(b.status))return {b:null,err:'Only a settled bet’s result can be fixed.'};
  if(!me||me!==b.backer)return {b:null,err:'Only the person who placed this bet can fix its result.'};
  const fx=b.fx,h=(b.fxh||[]).slice(),seen=id=>(fx&&fx.i===id)||h.some(e=>e.i===id);
  const close=(f,out,ans)=>Object.assign({i:f.i,by:f.by,from:b.status,r:f.r,at:f.at,out},ans?{ans}:{},{at2:at});
  const fin=nb=>{if(h.length)nb.fxh=h.slice(-20);else delete nb.fxh;delete nb.fx;return nb};
  if(op==='req'){
    if(!a||seen(a.i))return {b:null,err:''};
    if(!S24R.includes(a.r)||a.r===b.status)return {b:null,err:'Pick a different result.'};
    if(fx)h.push(close(fx,'replaced'));
    h.push({i:a.i,by:me,from:b.status,r:a.r,at,out:'fixed',at2:at});
    return {b:fin(Object.assign({},b,{status:a.r})),ok:'fixed'}}
  if(!fx||!a||fx.i!==a.i)return {b:null,err:'That change request is no longer open.'};
  if(op==='ok'){h.push(fx.by===me?Object.assign({},close(fx,'fixed'),{out:'fixed'}):close(fx,'confirmed',me));return {b:fin(Object.assign({},b,{status:fx.r})),ok:'confirmed'}}
  if(op==='no'){h.push(fx.by===me?close(fx,'withdrawn'):close(fx,'declined',me));return {b:fin(Object.assign({},b)),ok:fx.by===me?'withdrawn':'declined'}}
  return {b:null,err:''}}
/*</CREATOR-SETTLE>*/
async function s24Fix(id,op,i,r){
  if(U.busy)return;const me=b27Who();if(!me){presAsk();return}
  const a={i:i||b27Rid(),r};let last=null;
  const pre=U.doc.bets.find(x=>x.id===id);const chk=pre&&s24FixApply(pre,me,op,a,new Date().toISOString());if(chk&&!chk.b){U.msg=chk.err||'Already done.';U.msgBad=!!chk.err;render();return}
  U.busy=true;U.fixOpen=null;render();
  try{
    const back=await b27Write(cur=>cur.map(b=>{if(b.id!==id)return b;const x=s24FixApply(b,me,op,a,new Date().toISOString());if(x.b)last=x;return x.b||b}),
      cur=>{const b=cur.find(x=>x.id===id);return !b||!s24FixApply(b,me,op,a,new Date().toISOString()).b});
    b27Apply(back,'force');const b=back.find(x=>x.id===id);
    const ok=last&&last.ok;
    U.msg=!b?'That bet is gone.':/*<CREATOR-SETTLE>*/ok==='fixed'?'Result fixed to '+s24ResLbl(b,b.status)+'. Totals updated.':/*</CREATOR-SETTLE>*/ok==='asked'?'Change asked: '+s24ResLbl(b,a.r)+'. The result stays '+s24ResLbl(b,b.status)+' until the other side confirms.':ok==='confirmed'||ok==='agreed'?'Result corrected to '+s24ResLbl(b,b.status)+'. Totals updated.':ok==='declined'?'Change declined. The result stays '+s24ResLbl(b,b.status)+'.':ok==='withdrawn'?'Change request withdrawn.':'Saved.';U.msgBad=false;
  }catch(e){U.msg='Couldn’t save that. Try again.';U.msgBad=true}
  U.busy=false;render()}
function s24FixBadge(b){return b.fxh&&b.fxh.some(e=>e.out==='confirmed'/*<CREATOR-SETTLE>*/||e.out==='fixed'/*</CREATOR-SETTLE>*/)?' <span class="st fixd">Corrected</span>':''}
/*<CREATOR-SETTLE>*/function s24FixHtml(b,me){   // creator-only: the creator sees ✏️ Fix result (applies at once); everyone else only sees the result and the history
  if(b.kind==='pool')return '';
  const cr=!!me&&me===b.backer,fx=b.fx,set=S24R.includes(b.status),dis=U.busy?' disabled':'';let h='';

    if(cr)h+=`<div class="b27-act"><button type="button" class="btn b27-b" data-s24-fxok="${b.id}" onclick="s24Fix('${b.id}','ok','${fx.i}')"${dis}>✅ Change it</button><button type="button" class="btn sec b27-b" data-s24-fxno="${b.id}" onclick="s24Fix('${b.id}','no','${fx.i}')"${dis}>✖ Keep the result</button></div>`;
    h+='</div>'}
  if(set&&cr){const open=U.fixOpen===b.id;
    h+=`<div class="b27-act"><button type="button" class="btn sec b27-b" data-s24-fix="${b.id}" aria-expanded="${open}" onclick="U.fixOpen=U.fixOpen==='${b.id}'?null:'${b.id}';render()"${dis}>✏️ Fix result</button></div>`;
    if(open)h+=`<div class="b27-fx" data-s24-fixpick="${b.id}"><div class="note">Wrong result? Now: <b>${esc(s24ResLbl(b,b.status))}</b>. Pick the right one; it changes right away.</div><div class="b27-act">${S24R.filter(r=>r!==b.status).map(r=>`<button type="button" class="btn sec b27-b" data-s24-fxr="${r}" onclick="s24Fix('${b.id}','req',null,'${r}')"${dis}>${esc(s24ResLbl(b,r))}</button>`).join('')}</div></div>`}
  if(b.fxh&&b.fxh.length){const W={confirmed:'confirmed',declined:'declined',withdrawn:'withdrawn',replaced:'replaced by a newer request',fixed:'fixed by the creator'};
    h+=`<details class="b27-fxh"><summary>Result changes (${b.fxh.length})</summary><ul>${b.fxh.slice().reverse().map(e=>`<li>${esc(e.by)} ${e.out==='fixed'?'changed':'asked'} ${esc(s24ResLbl(b,e.from))} → ${esc(s24ResLbl(b,e.r))}${e.at?' · '+esc(s24When(e.at)):''} — <b>${esc(W[e.out])}</b>${e.ans?' by '+esc(e.ans):''}${e.at2&&e.out!=='fixed'?' · '+esc(s24When(e.at2)):''}</li>`).join('')}</ul></details>`}
  return h}

/* ---- Bets filter (2026-27 view): the older STOOPIDS two-select design (Wagers list: Everyone / person + status), plus "Me" and "Waiting on me".
   Remembered per device in localStorage (stoopids_b27_person / stoopids_b27_status): only the filter value ("me" is stored as the word me, never a name for it). ---- */
const S24FS=[['all','Any status'],['open','Open'],['settled','Settled'],['wash','Wash'],['wait','Waiting on me']],S24FPK='stoopids_b27_person',S24FSK='stoopids_b27_status';
const s24FP=()=>{const v=lsGet(S24FPK);return v==='me'||b27OwnerNames().includes(v)?v:'all'};
const s24FSt=()=>{const v=lsGet(S24FSK);return S24FS.some(x=>x[0]===v)?v:'all'};
function s24FSetP(v){lsSet(S24FPK,v==='me'||b27OwnerNames().includes(v)?v:'all');render()}
function s24FSetS(v){lsSet(S24FSK,S24FS.some(x=>x[0]===v)?v:'all');render()}
const s24InBet=(b,n)=>!!n&&(b.backer===n||b.other===n||b27Opps(b).includes(n)||(b.kind==='pool'&&Array.isArray(b.parts)&&b.parts.includes(n)));
const s24IsOpen=b=>b.status==='open'&&!(b.kind==='pool'&&b.back);
/* "Waiting on me": an open bet someone else placed against me (nobody has settled it yet), an open pool I'm in with no payouts, or a Fix result request from the other side that I have to confirm */
function s24Waiting(b,me){if(!me)return false;
  /*<CREATOR-SETTLE>*/if(b.fx&&S24R.includes(b.status)&&me===b.backer&&b.fx.by!==me)return true;/*</CREATOR-SETTLE>*/
  if(b.status!=='open')return false;
  if(b.kind==='pool')return !b.back&&b.backer!==me&&Array.isArray(b.parts)&&b.parts.includes(me);
  return b.backer!==me&&b27Opps(b).includes(me)}
let s24Q='';   // search text: this page view only, not stored
const s24Hay=b=>[b.text,b.backer,b.other,...b27Opps(b),...(Array.isArray(b.parts)?b.parts:[])].join(' ').toLowerCase();
function s24FSetQ(v){s24Q=String(v||'').slice(0,80);render()}
function s24Filter(bets,me){const p=s24FP(),st=s24FSt(),who=p==='me'?me:p==='all'?null:p,q=s24Q.trim().toLowerCase();
  return bets.filter(b=>(S24.sub&&b.id===S24.sub)||((!q||s24Hay(b).includes(q))&&(p==='all'||s24InBet(b,who))&&(st==='all'||(st==='wait'?s24Waiting(b,me):st==='open'?s24IsOpen(b):st==='settled'?(b.status==='backer'||b.status==='other'||(b.kind==='pool'&&b.status==='open'&&!!b.back)):st==='wash'?b.status==='push':true))))}
/* same markup + classes as the old 2025-26 Wagers filter (card > row2 > select, select, input.sb-in), all on one row */
function s24FilterBar(bets,me){const p=s24FP(),st=s24FSt(),n=bets.filter(b=>s24Waiting(b,me)).length;
  return `<div class="card s24fb"><div class="row2"><select id="sbPerson" aria-label="Person" onchange="s24FSetP(this.value)"><option value="all"${p==='all'?' selected':''}>Everyone</option><option value="me"${p==='me'?' selected':''}>Me</option>${b27OwnerNames().map(o=>`<option value="${esc(o)}"${o===p?' selected':''}>${esc(PN(o))}</option>`).join('')}</select>
   <select id="sbStatus" aria-label="Status" onchange="s24FSetS(this.value)">${S24FS.map(([k,t])=>`<option value="${k}"${k===st?' selected':''}>${esc(t)}${k==='wait'&&n?' ('+n+')':''}</option>`).join('')}</select>
