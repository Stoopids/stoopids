<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOOPIDS — NCAA Stoopids Pool</title>
<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
header{max-width:1000px;margin:0 auto;padding:0 0 8px}
.hero{position:relative;aspect-ratio:992/340;background:url(assets/hero-wide.jpg?v=4) center 14%/cover no-repeat;border-radius:0 0 18px 18px;overflow:hidden}
.titlebar{padding:12px 14px 4px;text-align:left}
.titlebar .tag{margin:6px 0 0;color:#e7ecf6}
.sub{padding:0 14px}
@media (max-width:640px){.hero{aspect-ratio:16/10;background-image:url(assets/hero-mobile.jpg?v=4);background-position:center 8%}}
h1{color:var(--acc);margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 span{color:var(--acc)}
.tag{color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin:8px 6px 0 0}
.badge.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;overflow:visible;max-width:1000px;margin:8px auto 0}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
@media (max-width:640px){nav{position:static}nav button{padding:5px 8px;font-size:12px}}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:12px 10px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}
.rank{font-size:26px;font-weight:900;width:36px;text-align:center;color:var(--acc)}
.who{flex:1;min-width:0}
.who b{font-size:17px}
.who small{display:block;color:var(--mut)}
.pts{font-size:28px;font-weight:900;text-align:right}
.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-block}
.chip.big{font-size:15px;padding:3px 11px 3px 3px}
.chip.big img{width:30px;height:30px}
.chip.out{opacity:.55;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:600}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.trow{cursor:pointer}
.det{background:var(--card2);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;margin:2px 3px 2px 0}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--mut)}
ul.it{margin:6px 0;padding-left:18px}
ul.it li{margin:2px 0}
.quip{color:var(--acc);font-style:italic;margin:6px 0 0}
h2{font-size:19px;margin:18px 0 6px}
.note{font-size:13px;color:var(--mut)}
select,.sel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit}
.gday{margin:16px 2px 4px;font-weight:800;color:var(--acc)}
.gm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.gm.h2h{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.gm .gh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.gside{display:flex;align-items:center;gap:8px;padding:4px 0}
.gside .nm{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gside .sc2{font-size:22px;font-weight:900;min-width:34px;text-align:right}
.gside.lose .sc2{color:var(--mut);font-weight:700}
.opill{display:inline-block;padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.opill.none{opacity:.5}
.gl{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13px}
.up{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:#7c2d12;color:#ffedd5}
.up.ns{background:var(--card2);color:var(--mut)}
.h2b{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:var(--acc);color:#111}
.seed{font-size:11px;color:var(--mut)}

.sb-in,.sb-ta{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:100%}
.sb-ta{min-height:70px}
.row2{display:flex;flex-wrap:wrap;gap:8px}.row2>*{flex:1 1 150px}
label.k{display:inline-flex;align-items:center;gap:4px;margin:3px 8px 3px 0;font-size:14px}
.btn{background:var(--acc);color:#111;border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.st{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid var(--line);background:var(--card2)}
.st.open{color:#7dd3fc}.st.settled{color:var(--good)}.st.wash{color:var(--mut)}.st.unparsed{color:#fbbf24;border-color:#8a6d12}
.mx td,.mx th{padding:5px 7px;font-size:13px;text-align:right;white-space:nowrap}.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx td.z{color:#4b566d}
pre.js{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.agrid .card{margin:0}
.agrid td.t{word-break:break-word}
.arow-champ td{background:rgba(255,210,63,.08)}
.crown{margin-left:4px}
.asel{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0 4px}
.asel select{font-size:16px;font-weight:700;min-width:190px}
.fine{font-size:12px;color:var(--mut)}
.pill.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
footer{max-width:1000px;margin:0 auto;padding:0 14px 40px;color:var(--mut);font-size:12px}
</style>

<body>
<header>
  <div class="hero" role="img" aria-label="The STOOPIDS crew"></div>
  <div class="titlebar"><h1>STOOP<span>IDS</span></h1><p class="tag" id="tag"></p></div>
  <div class="sub" id="badges" style="margin:0"></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="card">Loading the stoopidity…</div></main>
<footer id="foot"></footer>
<script src="archive.js?v=1"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const DEMO=params.has('demo');
let D=null,tab=params.get('tab')||'standings',ownerSel=null,openTeam={};
const TABS=[['standings','🏆 Standings'],['games','📅 Games'],['rosters','👥 Rosters'],['bets','🎲 Side bets'],['teams','🏀 All teams'],['checklist','✅ Post Season'],['redraft','🔄 Jan 20 redraft'],['archive','🗂️ Archive'],['about','📖 Rules & sources']];

/* ---------- color helpers (auto contrast) ---------- */
function hex2rgb(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))return null;return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function lum(rgb){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(rgb[0])+.7152*f(rgb[1])+.0722*f(rgb[2])}
function textOn(hex){const r=hex2rgb(hex);if(!r)return '#fff';const L=lum(r);return (1.05)/(L+.05) > (L+.05)/.05 ? '#fff':'#111'}
function chip(tid,opt){opt=opt||{};const t=D.teams[tid]||{};if(!t.short&&opt.name)t.short=opt.name;const bg='#'+((t.color||'').replace('#','')||'3a4256');const alt='#'+((t.alt||'').replace('#','')||'ffffff');
  const fg=textOn(bg);const logo=t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=nologo></span>'">`:'<span class="nologo"></span>';
  return `<span class="chip${opt.big?' big':''}${opt.out?' out':''}" style="background:${bg};color:${fg};border-color:${alt}">${logo}${esc(t.short||t.name||tid)}</span>`}
/* ---------- helpers ---------- */
const rec=tid=>{const r=D.records[tid]||{w:0,l:0};return r.w+'-'+r.l};
const sign=n=>n>0?'+'+n:String(n);
function ownerOf(tid){for(const o of D.owners)for(const t of o.teams)if(t.tid===tid&&t.status!=='dropped')return o.name;return '—'}
function wibDay(d){return d}
function quip(o,i,n){
  if(D.meta.mode==='preseason')return ['Everyone is 0-0 and a genius. Enjoy it.','Undefeated in spirit.','Zero points. Zero mistakes. Peak performance.'][i%3];
  if(i===0)return 'Don\u2019t get cocky. Cocky gets a 5-seed.';
  if(i===n-1)return 'Proud owner of the participation trophy.';
  return ['Hanging in there.','Vibes are immaculate, points are TBD.','Blame the refs.','The committee will remember this.'][i%4];
}
function stamp(){return D.meta.generated_at_wib}
/* ---------- views ---------- */
const NOPTS=['No points yet. Everyone starts somewhere (0).','Zero points. Pure potential.','Nothing on the board yet. Dream big.','0 points and no evidence of poor drafting.','Spotless record, because nothing has happened.','No points yet. The comeback story starts here.','Blank scoreboard. Peak optimism.'];
function noPts(n){let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return NOPTS[(h+(window._tagSeed||(window._tagSeed=Math.floor(Math.random()*997))))%NOPTS.length]}
function vStandings(){
  const mx=Math.max(10,...D.owners.map(o=>o.total));
  return D.owners.map((o,i)=>`<div class="card"><div class="lb" onclick="goOwner('${esc(o.name)}')">
    <div class="rank">${o.rank}</div>
    <div class="who"><b>${esc(o.emoji)} ${esc(o.name)}</b><small>${esc(o.team_name)}</small><div class="quip">${esc(quip(o,i,D.owners.length))}</div></div>
    <div class="pts">${o.total}<small>points</small></div></div>
    <div class="bar"><i style="width:${Math.max(0,o.total)/mx*100}%"></i></div>
    <div class="chips">${o.teams.map(t=>chip(t.tid,{out:t.status==='dropped'})).join('')}</div></div>`).join('')+
    `<p class="note">Tap an owner for the full breakdown. Struck-through teams were dropped in the Jan 20 redraft.</p>`}
function goOwner(n){ownerSel=n;tab='rosters';render();window.scrollTo(0,0)}

/* ---------- games tab ---------- */
const WIBD=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short'});
const WIBT=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false});
const WIBK=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'});
function wibKey(g){if(g.start){const d=new Date(g.start);if(!isNaN(d))return WIBK.format(d)}return g.day}
function wibLabel(k){const d=new Date(k+'T12:00:00Z');return WIBD.format(d)}
function wibTime(g){if(g.start){const d=new Date(g.start);if(!isNaN(d))return WIBT.format(d)+' WIB'}return 'time TBD'}
const fml=n=>n==null?'–':(n>0?'+'+n:String(n));
const ownerEmoji=n=>{const o=D.owners.find(x=>x.name===n);return o?o.emoji:''};
const opills=a=>a&&a.length?a.map(n=>`<span class="opill">${esc(ownerEmoji(n))} ${esc(n)}</span>`).join(''):'<span class="opill none">no owner</span>';
function lineTxt(ln,away,home,final){
  if(!ln)return null;
  const fav=ln.fav_name?`<b>${esc(ln.fav_name)}</b> -${ln.sp!=null?ln.sp:'?'}`:'Pick\u2019em';
  const ml=(ln.aml!=null||ln.hml!=null)?` · ML ${esc(away)} ${fml(ln.aml)} / ${esc(home)} ${fml(ln.hml)}`:'';
  const ou=ln.ou!=null?` · O/U ${ln.ou}`:'';
  return `${final?(ln.type==='close'?'Closing line':'Last line'):'Line'}: ${fav}${ml}${ou} <span class="mut">· ${esc(ln.p||'')}</span>`}
function gameCard(g){
  const fin=g.status==='final',live=g.status==='live';
  const dog=g.line&&g.line.dog;
  const row=(s,other)=>{
    const lose=fin&&!s.win;const tag=g.line?(String(dog)===String(s.id)?' <span title="betting underdog">🐶</span>':(String(g.line.fav)===String(s.id)?' <span title="betting favorite">⭐</span>':'')):'';
    return `<div class="gside${lose?' lose':''}"><div class="nm">${chip(s.id,{big:1,name:s.short})}${s.seed?`<span class="seed">(${s.seed})</span>`:''}${tag}${opills(s.owners)}</div><div class="sc2">${(fin||live)&&s.score!=null?s.score:''}</div></div>`};
  let head=`<span>${fin?'FINAL':live?'<b class="good">LIVE</b>':'<b>'+wibTime(g)+'</b>'}</span>`;
  if(g.round)head+=`<span>· ${esc(g.round)}</span>`;else if(g.kind==='conf')head+='<span>· Conf tournament</span>';
  if(g.neutral)head+='<span>· neutral</span>';
  if(g.h2h)head+=`<span class="h2b">🥊 ${esc(g.away.owners.join('/'))} vs ${esc(g.home.owners.join('/'))}</span>`;
  if(g.civil)head+=`<span class="h2b">🙃 CIVIL WAR (${esc(g.away.owners.join('/'))} wins either way)</span>`;
  let lt=lineTxt(g.line,g.away.short,g.home.short,fin);
  let foot=lt||(fin?'<span class="mut">No betting line on file for this game.</span>':'<span class="mut">📭 line not posted yet</span>');
  if(fin&&g.upset){const u=g.upset;if(u.is)foot+=` <span class="up${u.scored?'':' ns'}">😱 UPSET${u.scored?' +'+D.meta.points.upset:' (not scored: outside upset rules)'}${u.fallback?' ⚠️ by seed':''}</span>`;else if(u.is===false&&g.line)foot+=' <span class="mut">· favorite won, no upset</span>'}
  return `<div class="gm${g.h2h||g.civil?' h2h':''}"><div class="gh">${head}</div>${row(g.away)}${row(g.home)}<div class="gl">${foot}</div></div>`}
let gOwner='all',gMode=null,gDay='all',gH2H=params.has('h2h');
function vGames(){
  const all=D.games||[];
  const ups=all.filter(g=>g.status!=='final'),fin=all.filter(g=>g.status==='final');
  if(!gMode)gMode=ups.length?'upcoming':'scores';
  let list=(gMode==='upcoming'?ups:fin.slice().reverse());
  if(gOwner!=='all')list=list.filter(g=>g.home.owners.includes(gOwner)||g.away.owners.includes(gOwner));
  if(gH2H)list=list.filter(g=>g.h2h||g.civil);
  const days=[...new Set(list.map(wibKey))];
  if(gDay!=='all'&&!days.includes(gDay))gDay='all';
  if(gDay!=='all')list=list.filter(g=>wibKey(g)===gDay);
  if(gMode==='upcoming')list.sort((a,b)=>(a.start||a.day).localeCompare(b.start||b.day));
  let h=`<div class="card"><div class="tabs" style="margin:0 0 8px"><button class="${gMode==='upcoming'?'on':''}" onclick="gMode='upcoming';gDay='all';render()">⏭ Upcoming (${ups.length})</button><button class="${gMode==='scores'?'on':''}" onclick="gMode='scores';gDay='all';render()">✅ Scores (${fin.length})</button></div>
   <div class="tabs" style="margin:0"><select onchange="gOwner=this.value;render()"><option value="all">All owners</option>${D.owners.map(o=>`<option value="${esc(o.name)}"${o.name===gOwner?' selected':''}>${esc(o.emoji)} ${esc(o.name)}</option>`).join('')}</select>
   <select onchange="gDay=this.value;render()"><option value="all">All days</option>${days.map(k=>`<option value="${k}"${k===gDay?' selected':''}>${esc(wibLabel(k))}</option>`).join('')}</select>
   <button class="${gH2H?'on':''}" onclick="gH2H=!gH2H;render()">🥊 Pool vs pool only</button></div>
   <div class="note" style="margin-top:6px">Times in WIB. ⭐ = betting favorite, 🐶 = underdog. Lines: ${D.meta.games_view.n_with_line}/${D.meta.games_view.n_games} games have one on file (${esc((D.meta.sources||{}).odds||'')}).</div></div>`;
  if(!list.length)return h+`<div class="card">${all.length?'Nothing matches those filters.':'No games for rostered teams yet. Check back when the schedule fills in.'}</div>`;
  if(gMode==='upcoming'&&D.meta.mode==='preseason')h+=`<div class="card note">Preseason: only the first few nights of the schedule are loaded, and sportsbooks have posted lines for just some of them so far. Everything refreshes automatically.</div>`;
  let cur=null;
  list.forEach(g=>{const k=wibKey(g);if(k!==cur){cur=k;h+=`<div class="gday">${esc(wibLabel(k))}</div>`}h+=gameCard(g)});
  return h}
function gameLine(g){/* compact line for a team-row game (roster tab) */
  const ln=g.ln;if(!ln)return g.status==='final'?'':'<div class="mut" style="font-size:12px">📭 line not posted yet</div>';
  const fav=ln.fav_name?`${esc(ln.fav_name)} -${ln.sp!=null?ln.sp:'?'}`:'Pick\u2019em';
  let s=`<div class="mut" style="font-size:12px">${g.status==='final'?(ln.type==='close'?'Closing':'Last'):'Line'}: ${fav}${ln.ou!=null?' · O/U '+ln.ou:''}· ${esc(ln.p||'')}${ln.we_dog?' · 🐶 underdog':ln.we_fav?' · ⭐ favorite':''}${g.upset?' <span class="up">😱 UPSET</span>':''}</div>`;
  return s}


/* ---------- side bets ---------- */
let sbScope='all',sbPaid=false,sbPerson='all',sbStatus='all',sbQ='',sbForm=null,sbMsg='',editOK=null;
/*<SHARED-BETS-CORE>*/
/* Ledger maths in JS: a line-for-line port of bets.py (parse_amount, build_entries, bet_status, tally, validate_bet,
   merge_shared, package). test_shared.py runs this exact block under node and compares it with the Python output. */
const SB_SUF={k:1e3,kk:1e6,m:1e6,mil:1e6,mill:1e6,million:1e6,juta:1e6,jt:1e6,mm:1e6};
const SB_ALLOWED={versus:['type','n','text','date','season','side_a','side_b','stake','stake_item','odds','longshot','winner','games','outcome','id','created_at'],
  pool:['type','n','text','id','created_at','date','season','participants','buy_in','payouts','outcome']};
const SB_PATCHABLE=['winner','games','payouts','outcome','text','stake','odds','longshot'];
const SB_ODDS=/^\s*(\d+(?:\.\d+)?)\s*(?::|-|to)\s*(\d+(?:\.\d+)?)\s*$/;
function parseAmount(s,defK){
  if(s==null)return null;
  if(typeof s==='number')return s;
  const t=String(s).trim().toLowerCase().replace(/[ _]/g,'');
  const m=/^(\d[\d,]*(?:\.\d+)?)(k|kk|m|mm|mil|mill|million|juta|jt)?$/.exec(t);
  if(!m)return null;
  const num=parseFloat(m[1].replace(/,/g,''));
  if(m[2])return num*SB_SUF[m[2]];
  return defK&&num<1000?num*1000:num;
}
function round2(x){const y=x*100,f=Math.floor(y);return (y-f===0.5?(f%2===0?f:f+1):Math.round(y))/100}   // Python round(x,2): ties to even
const truthy=v=>!(v==null||v===''||v===0||v===false||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length));
function buildEntries(bet){
  const t=('type' in bet)?bet.type:'direct';
  if(t==='direct')return (bet.entries||[]).map(e=>Object.assign({},e));
  const out=[];
  if(t==='versus'){
    let w=bet.winner;
    let stake=(bet.stake!=null&&bet.stake!=='')?parseAmount(bet.stake,true):null;
    const item=bet.stake_item,games=bet.games;
    if(truthy(games)){
      const diff=(games.a||0)-(games.b||0);
      if(diff===0||stake===null)return [];
      w=diff>0?'a':'b';stake=stake*Math.abs(diff);
    }

  if(extra.length)throw new Error('unexpected fields: '+extra.sort().join(', '));
  if(!String(bet.text==null?'':bet.text).trim())throw new Error("write the wager terms in 'text'");
  if(String(bet.text).length>500)throw new Error('terms are too long (500 characters max)');

    if(bet.side_a.some(i=>bet.side_b.includes(i)))throw new Error("a person can't be on both sides");

    if(bet.winner!=null&&!['a','b','wash'].includes(bet.winner))throw new Error('winner must be a, b, wash or empty (open)');
    if(truthy(bet.odds)&&!SB_ODDS.test(String(bet.odds)))throw new Error('odds look like 2:1 or 3.5:1');

  h+=D.owners.map(o=>{const m=r.moves[o.name]||{};return `<div class="card"><b>${esc(o.emoji)} ${esc(o.name)}</b>
    <div class="note">Drops: ${(m.drop||[]).map(esc).join(', ')||'—'} &nbsp;|&nbsp; Adds: ${(m.add||[]).map(esc).join(', ')||'—'}</div>
    <div class="chips">${o.teams.map(t=>chip(t.tid,{out:t.status==='dropped'})+`<span class="note" style="align-self:center">${t.window.start?'from '+esc(t.window.start):''}${t.window.end?'until '+esc(t.window.end):''}</span>`).join('')}</div></div>`}).join('');
  return h}
function vAbout(){
  const P=D.meta.points,m=D.meta;
  const rows=[['Win (reg season + conf tourney, any opponent)',P.win],['Conference regular-season champ',P.conf_reg],['Conference tournament champ',P.conf_tourn],['Make the NCAA field',P.ncaa_entry],['Play-in (First Four) win',P.playin_win],['Upset (NCAA tournament: beat a better seed)',P.upset],['NCAA tournament win',P.ncaa_win],['Final Four',P.final4],['National champ',P.champ],['Miss the Big Dance',P.missed_dance]];
  return `<div class="card sc"><table><tr><th>Scoring</th><th class="n">Pts</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td class="n">${sign(r[1])}</td></tr>`).join('')}</table></div>
  ${vUpsets()}
  <div class="card"><b>Where the numbers come from</b><ul class="it">
   <li><b>Scores, records, seeds, tournament rounds:</b> ESPN public scoreboard (primary). Fallback: ncaa.com data via the free ncaa-api.henrygd.me relay, used automatically for any day ESPN fails (scores/seeds only).</li>
   <li><b>Betting lines (Games tab; tournament upsets use seeds, not lines):</b> ESPN odds API (DraftKings preferred; live in-game odds are ignored). Upcoming games show the latest posted line (re-checked every refresh, books usually post a few days ahead, otherwise 'line not posted yet'); final games keep the stored closing line.</li>
   <li><b>Conference regular-season champs:</b> ESPN standings (top conference seed, which includes tiebreaks) once the conference tournament starts.</li>
   <li><b>Rosters:</b> your Google Sheet, re-read on every refresh.</li></ul>
   <b>Automatic</b>: wins, losses, conf tournament champs, conf regular-season champs, NCAA entry, play-in wins, NCAA wins, Final Four, champ, missed dance, upsets.<br>
   <b>Manual</b>: the Jan 20 redraft moves (config.json), and any corrections or rulings (overrides.json: force/deny a bonus, force/deny an upset, add a commissioner adjustment).</div>
  <div class="card"><b>House interpretations (change in config.json)</b><ul class="it">
   <li>Upset bonus applies to <b>${esc(m.rules.upset_games.join(', '))}</b> games only (the sheet says "beats a higher seed in the NCAA tournament"). Equal seeds = no upset. First Four upsets: ${m.rules.upset_first_four?'on':'off'}.</li>
   <li>A First Four win = +1 play-in and +5 for making the field, but not the +2 NCAA win. A First Four loser: ${m.rules.first_four_loser_penalty?'gets -1':'no -1 penalty (just no +5)'}.</li>
   <li>Games vs non-Division I opponents that ESPN lists count as wins (rule says "any opponent"): ${m.rules.count_non_d1_wins?'yes':'no'}.</li>
   <li>NIT/CBI/Crown and other postseason wins don't count. Postponed/canceled games give nothing.</li></ul></div>
  <div class="card"><b>Data health</b><ul class="it"><li>Updated: ${esc(m.generated_at_wib)}</li><li>Mode: ${esc(m.mode)} · season ${esc(m.season)} · games loaded ${m.games_loaded} (${m.final_games} final)</li>
   <li>Days fetched fresh ${m.fetch.days_fetched}, cached ${m.fetch.days_cached}, ncaa.com fallback ${m.fetch.days_ncaa_fallback}, failed ${m.fetch.days_failed_both}</li>
   <li>Betting lines found ${m.odds.lines_found}/${m.odds.games_needing_line}</li><li>Rosters: ${esc(m.roster_source)}; sheet ${m.sheet_ok?'OK':'ERROR '+esc(m.sheet_error)}</li>
   ${m.warnings.length?'<li class="bad">Warnings: '+m.warnings.map(esc).join('; ')+'</li>':''}</ul></div>`}
/* ---------- archive (static: archive.js built once by archive_build.py) ---------- */
let archSel=null;
function archOwnerName(o){
  const cur=o.current_owner&&o.current_owner!==o.person?` <span class="mut">(${esc(o.current_owner)})</span>`:'';
  return `<b>${esc(o.person)}</b>${cur}`}
function archEmoji(o){const m=o.current_owner&&D&&D.owners?D.owners.find(x=>x.name===o.current_owner):null;return m&&m.emoji?esc(m.emoji)+' ':''}
function archRank(o){return o.rank==null?'–':(o.tie?'T-':'')+o.rank}
function archAllTime(A){
  const rows=A.alltime;const cnt=p=>p.title_seasons.filter(y=>!((A.seasons.find(s=>s.season===y)||{}).no_tournament)).length;
  const maxS=Math.max(...rows.map(p=>p.seasons));
  const waiting=rows.filter(p=>cnt(p)===0&&p.seasons===maxS).map(p=>p.person);
  const q=waiting.length?`${waiting.join(' and ')} ${waiting.length>1?'have':'has'} played ${maxS} seasons without a title. Next year is always next year.`:'Every title here is real. Nobody asked for the receipts.';
  return `<div class="card"><b>🏛️ All-time</b> <span class="note">· ${A.seasons_played} seasons played, computed from the archived sheets</span>
   <div class="quip">${esc(q)}</div>
   <div class="sc"><table><tr><th>Owner</th><th class="n">Titles</th><th class="n">Seasons</th><th>Title years</th></tr>`+
   rows.map(p=>{const cur=p.current_owner&&p.current_owner!==p.person?` <span class="mut">(${esc(p.current_owner)})</span>`:'';
    const yrs=p.title_seasons.slice().sort().reverse().map(y=>esc(y)+(((A.seasons.find(s=>s.season===y)||{}).no_tournament)?' 🦠':'')).join(', ')||'<span class="mut">—</span>';
    return `<tr><td><b>${esc(p.person)}</b>${cur}</td><td class="n">${cnt(p)?'🏆 '+cnt(p):'0'}</td><td class="n">${p.seasons}</td><td>${yrs}</td></tr>`}).join('')+
   `</table></div><div class="fine">🦠 = 2019-20, when the NCAA tournament was cancelled. Listed as a title year, but not counted in the Titles total. A title is the top total in that season's sheet. Tied firsts would not be counted.</div></div>`}
function archTeams(o){
  return `<div class="sc"><table><tr><th>#</th><th>Team</th><th class="n">Wins</th><th class="n">Pts</th></tr>`+
   o.teams.map(t=>`<tr><td>${t.pick}</td><td class="t">${t.name?esc(t.name):'<i class="mut">(no team name in sheet)</i>'}${t.redraft_add?' <span class="pill" title="Pick 9–10 carry the Jan 20 adjustment column">Jan 20 pick</span>':''}</td><td class="n mut">${t.wins==null?'':t.wins}</td><td class="n"><b>${t.pts==null?'—':t.pts}</b></td></tr>`).join('')+
   `</table></div>`}
function vArchive(){
  const A=window.ARCHIVE;
  if(!A)return '<div class="card">Couldn\u2019t load archive.js.</div>';
  const seasons=A.seasons; // newest first
  if(!archSel||!seasons.some(s=>s.season===archSel))archSel=(seasons.find(s=>s.pool)||seasons[0]).season;
  const S=seasons.find(s=>s.season===archSel);
  const opts=seasons.map(s=>`<option value="${esc(s.season)}"${s.season===archSel?' selected':''}>${esc(s.season)}${s.pool?'':': no pool'}</option>`).join('');
  let h=`<h2>🗂️ Season archive</h2>
   <div class="asel"><label for="archsel" class="mut">Season</label><select id="archsel" onchange="archSel=this.value;render()">${opts}</select></div>
   <div class="note">Results as the sheet shows them. No side bets here.</div>`;
  if(!S.pool)return h+`<div class="card"><b>${esc(S.season)}: no pool</b><div class="note">${S.notes.map(esc).join(' ')}</div></div>`+archAllTime(A);
  const champs=S.owners.filter(o=>o.champ);
  h+=`<div class="card"><b>${esc(S.season)}</b> <span class="note">· ${S.owners.length} owners${S.no_tournament?' · 🦠 no NCAA tournament':''}</span>
    <div style="margin-top:6px">${S.champion.length>1?'Tied for first':'Champion'}: ${champs.map(o=>'👑 '+archEmoji(o)+archOwnerName(o)).join(' & ')} <b>${S.top_total}</b> pts</div>`+
    (S.notes.length?`<ul class="it note">${S.notes.map(n=>'<li>'+esc(n)+'</li>').join('')}</ul>`:'')+`</div>`;
  h+=`<div class="card"><b>Final standings</b><div class="sc"><table><tr><th>Rank</th><th>Owner / team</th><th class="n">Points</th></tr>`+
    S.owners.map(o=>`<tr class="${o.champ?'arow-champ':''}"><td><b>${archRank(o)}</b></td><td>${archEmoji(o)}${archOwnerName(o)}${o.champ?'<span class="crown" title="Champion">👑</span>':''}<div class="fine">${esc(o.team_name)}</div></td><td class="n"><b>${o.total}</b></td></tr>`).join('')+
    `</table></div></div><h2>Rosters &amp; points</h2><div class="agrid">`+
    S.owners.map(o=>`<div class="card"><div class="lb"><div class="rank">${o.champ?'👑':archRank(o)}</div><div class="who">${archEmoji(o)}${archOwnerName(o)}<small>${esc(o.team_name)}</small></div><div class="pts">${o.total}<small>points</small></div></div>`+
      (o.team_sum!=null?`<div class="note"><span class="pill warn">sheet quirk</span> Sheet total is ${o.total}; the teams below add up to ${o.team_sum}. Showing the sheet's total.</div>`:'')+
      (o.unranked?`<div class="note"><span class="pill warn">unranked</span> ${esc(o.unranked)}</div>`:'')+
      archTeams(o)+`</div>`).join('')+`</div>`;
  return h+archAllTime(A)}
const VIEWS={standings:vStandings,games:vGames,bets:vBets,rosters:vRosters,teams:vTeams,checklist:vChecklist,redraft:vRedraft,archive:vArchive,about:vAbout};
function render(){
  if(!D)return;const m=D.meta;
  if(!window._tagPick)window._tagPick={};
  const TAGS={
   preseason:['0-0 and full of hope. The season hasn\u2019t started, so everyone is a genius.','Nobody has lost yet, so every draft was brilliant.','Preseason: where every roster is a masterpiece and every owner is undefeated.','Zero games played, zero bad takes proven wrong. Enjoy it.','The hot takes are free until November.','Everyone is in first place. It will not last.','Every team is a Final Four team on paper. Paper is patient.'],
   live:['Where college basketball knowledge goes to be humbled.','Confidence is high. The scoreboard disagrees.','Every win is skill. Every loss is the refs.','Somebody\u2019s mid-major is carrying them. Somebody\u2019s blue blood is not.','Bragging rights are updated every 15 minutes.'],
   final:['The season is over. Someone is insufferable now.','The trophy is decided. The group chat will never be the same.','It\u2019s over. Screenshots will be used against you.'],
   demo:['DEMO: last season\u2019s real results run through this year\u2019s rosters. Nobody\u2019s actual points.']};
  const pickTag=(k,arr)=>{if(window._tagPick[k]==null)window._tagPick[k]=Math.floor(Math.random()*arr.length);return arr[window._tagPick[k]%arr.length]};
  $('#tag').textContent=TAGS[m.mode]?pickTag('tag'+m.mode,TAGS[m.mode]):'';
  $('#badges').innerHTML=(m.mode==='demo'?'<span class="badge warn">DEMO DATA</span>':'')+(m.warnings.length?'<span class="badge warn">⚠ '+m.warnings.length+' warning(s) — see Rules &amp; sources</span>':'');
  $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
  $('#main').innerHTML=(VIEWS[tab]||vStandings)();
  $('#foot').innerHTML=`STOOPIDS · times in WIB (Asia/Jakarta) · scores ESPN (fallback ncaa.com) · ${DEMO?'<a href="?">back to the live season</a>':'<a href="?demo=1">see the demo (last season replay)</a>'}`;
}
function load(){
  const s=document.createElement('script');s.src=(DEMO?'demo/':'')+'data.js?v='+Date.now();
  s.onload=()=>{D=window.STOOPIDS_DATA;D._base=D.bets;applyShared();render()};
  s.onerror=()=>{if(!D)$('#main').innerHTML='<div class="card">Couldn\u2019t load data.js. Run <code>python3 refresh.py</code> first.</div>'};
  document.head.appendChild(s);
}
load();setInterval(load,5*60*1000);
</script>
