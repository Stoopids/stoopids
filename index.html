<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STOOPIDS — NCAA Stoopids Pool</title>
<style>
:root{--bg:#10131a;--card:#1a1f2b;--card2:#222939;--line:#2d3548;--tx:#eef1f7;--mut:#9aa6bd;--acc:#ffd23f;--good:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc)}
header{max-width:1000px;margin:0 auto;padding:0 0 8px}
.hero{position:relative;min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px 14px 14px;background:linear-gradient(180deg,rgba(16,19,26,.05) 0%,rgba(16,19,26,.55) 55%,rgba(16,19,26,.96) 100%),url(assets/hero-wide.jpg) center 22%/cover no-repeat;border-radius:0 0 18px 18px;overflow:hidden}
.hero h1{text-shadow:0 2px 10px rgba(0,0,0,.85)}
.hero .tag{color:#e7ecf6;text-shadow:0 1px 6px rgba(0,0,0,.9)}
.sub{padding:0 14px}
@media (max-width:640px){.hero{min-height:270px;background:linear-gradient(180deg,rgba(16,19,26,.05) 0%,rgba(16,19,26,.6) 58%,rgba(16,19,26,.97) 100%),url(assets/hero-mobile.jpg) center 12%/cover no-repeat}}
@media (min-width:1000px){.hero{border-radius:0 0 18px 18px;min-height:280px;background-position:center 20%}}
h1{margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;font-weight:900;line-height:1}
h1 span{color:var(--acc)}
.tag{color:var(--mut);margin:6px 0 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--card2);border:1px solid var(--line);margin:8px 6px 0 0}
.badge.warn{background:#4b3a0b;border-color:#8a6d12;color:#ffe08a}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 10px;display:flex;gap:6px;overflow-x:auto;max-width:1000px;margin:8px auto 0}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{max-width:1000px;margin:0 auto;padding:12px 10px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.lb{display:flex;align-items:center;gap:10px;cursor:pointer}
.rank{font-size:26px;font-weight:900;width:36px;text-align:center;color:var(--acc)}
.who{flex:1;min-width:0}
.who b{font-size:17px}
.who small{display:block;color:var(--mut)}
.pts{font-size:28px;font-weight:900;text-align:right}
.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;font-weight:700;font-size:12.5px;border:2px solid transparent;max-width:100%}
.chip img,.chip .nologo{width:22px;height:22px;border-radius:50%;background:#fff;object-fit:contain;padding:1px;flex:none}
.chip .nologo{display:inline-block}
.chip.big{font-size:15px;padding:3px 11px 3px 3px}
.chip.big img{width:30px;height:30px}
.chip.out{opacity:.55;text-decoration:line-through}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 11px;cursor:pointer;font-weight:600}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.trow{cursor:pointer}
.det{background:var(--card2);border-radius:10px;padding:8px 10px;margin:4px 0 10px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;margin:2px 3px 2px 0}
.good{color:var(--good)}.bad{color:var(--bad)}.mut{color:var(--mut)}
ul.it{margin:6px 0;padding-left:18px}
ul.it li{margin:2px 0}
.quip{color:var(--acc);font-style:italic;margin:6px 0 0}
h2{font-size:19px;margin:18px 0 6px}
.note{font-size:13px;color:var(--mut)}
select,.sel{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit}
.gday{margin:16px 2px 4px;font-weight:800;color:var(--acc)}
.gm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.gm.h2h{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.gm .gh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:6px}
.gside{display:flex;align-items:center;gap:8px;padding:4px 0}
.gside .nm{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.gside .sc2{font-size:22px;font-weight:900;min-width:34px;text-align:right}
.gside.lose .sc2{color:var(--mut);font-weight:700}
.opill{display:inline-block;padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.opill.none{opacity:.5}
.gl{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;font-size:13px}
.up{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:#7c2d12;color:#ffedd5}
.up.ns{background:var(--card2);color:var(--mut)}
.h2b{display:inline-block;padding:1px 8px;border-radius:99px;font-weight:800;font-size:12px;background:var(--acc);color:#111}
.seed{font-size:11px;color:var(--mut)}

.sb-in,.sb-ta{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;width:100%}
.sb-ta{min-height:70px}
.row2{display:flex;flex-wrap:wrap;gap:8px}.row2>*{flex:1 1 150px}
label.k{display:inline-flex;align-items:center;gap:4px;margin:3px 8px 3px 0;font-size:14px}
.btn{background:var(--acc);color:#111;border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.st{display:inline-block;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:800;border:1px solid var(--line);background:var(--card2)}
.st.open{color:#7dd3fc}.st.settled{color:var(--good)}.st.wash{color:var(--mut)}.st.unparsed{color:#fbbf24;border-color:#8a6d12}
.mx td,.mx th{padding:5px 7px;font-size:13px;text-align:right;white-space:nowrap}.mx td:first-child,.mx th:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.mx td.z{color:#4b566d}
pre.js{background:#0b0e14;border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
footer{max-width:1000px;margin:0 auto;padding:0 14px 40px;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="hero"><h1>STOOP<span>IDS</span></h1><p class="tag" id="tag"></p></div>
  <div class="sub" id="badges"></div>
</header>
<nav id="nav"></nav>
<main id="main"><div class="card">Loading the stoopidity…</div></main>
<footer id="foot"></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=new URLSearchParams(location.search);
const DEMO=params.has('demo');
let D=null,tab=params.get('tab')||'standings',ownerSel=null,openTeam={};
const TABS=[['standings','🏆 Standings'],['games','📅 Games'],['rosters','👥 Rosters'],['bets','🎲 Side bets'],['teams','🏀 All teams'],['checklist','✅ Bonus checklist'],['upsets','😱 Upsets'],['redraft','🔄 Jan 20 redraft'],['about','📖 Rules & sources']];

/* ---------- color helpers (auto contrast) ---------- */
function hex2rgb(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(!/^[0-9a-f]{6}$/i.test(h))return null;return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function lum(rgb){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(rgb[0])+.7152*f(rgb[1])+.0722*f(rgb[2])}
function textOn(hex){const r=hex2rgb(hex);if(!r)return '#fff';const L=lum(r);return (1.05)/(L+.05) > (L+.05)/.05 ? '#fff':'#111'}
function chip(tid,opt){opt=opt||{};const t=D.teams[tid]||{};if(!t.short&&opt.name)t.short=opt.name;const bg='#'+((t.color||'').replace('#','')||'3a4256');const alt='#'+((t.alt||'').replace('#','')||'ffffff');
  const fg=textOn(bg);const logo=t.logo?`<img src="${esc(t.logo)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=nologo></span>'">`:'<span class="nologo"></span>';
  return `<span class="chip${opt.big?' big':''}${opt.out?' out':''}" style="background:${bg};color:${fg};border-color:${alt}">${logo}${esc(t.short||t.name||tid)}</span>`}
/* ---------- helpers ---------- */
const rec=tid=>{const r=D.records[tid]||{w:0,l:0};return r.w+'-'+r.l};
const sign=n=>n>0?'+'+n:String(n);
function ownerOf(tid){for(const o of D.owners)for(const t of o.teams)if(t.tid===tid&&t.status!=='dropped')return o.name;return '—'}
function wibDay(d){return d}
function quip(o,i,n){
  if(D.meta.mode==='preseason')return ['Everyone is 0-0 and a genius. Enjoy it.','Undefeated in spirit.','Zero points. Zero mistakes. Peak performance.'][i%3];
  if(i===0)return 'Don\u2019t get cocky. Cocky gets a 5-seed.';
  if(i===n-1)return 'Proud owner of the participation trophy.';
  return ['Hanging in there.','Vibes are immaculate, points are TBD.','Blame the refs.','The committee will remember this.'][i%4];
}
function stamp(){return D.meta.generated_at_wib}
/* ---------- views ---------- */
function vStandings(){
  const mx=Math.max(10,...D.owners.map(o=>o.total));
  return D.owners.map((o,i)=>`<div class="card"><div class="lb" onclick="goOwner('${esc(o.name)}')">
    <div class="rank">${o.rank}</div>
    <div class="who"><b>${esc(o.emoji)} ${esc(o.name)}</b><small>${esc(o.team_name)}</small><div class="quip">${esc(quip(o,i,D.owners.length))}</div></div>
    <div class="pts">${o.total}<small>points</small></div></div>
    <div class="bar"><i style="width:${Math.max(0,o.total)/mx*100}%"></i></div>
    <div class="chips">${o.teams.map(t=>chip(t.tid,{out:t.status==='dropped'})).join('')}</div></div>`).join('')+
    `<p class="note">Tap an owner for the full breakdown. Struck-through teams were dropped in the Jan 20 redraft.</p>`}
function goOwner(n){ownerSel=n;tab='rosters';render();window.scrollTo(0,0)}

/* ---------- games tab ---------- */
const WIBD=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short'});
const WIBT=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',hour12:false});
const WIBK=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'});
function wibKey(g){if(g.start){const d=new Date(g.start);if(!isNaN(d))return WIBK.format(d)}return g.day}
function wibLabel(k){const d=new Date(k+'T12:00:00Z');return WIBD.format(d)}
function wibTime(g){if(g.start){const d=new Date(g.start);if(!isNaN(d))return WIBT.format(d)+' WIB'}return 'time TBD'}
const fml=n=>n==null?'–':(n>0?'+'+n:String(n));
const ownerEmoji=n=>{const o=D.owners.find(x=>x.name===n);return o?o.emoji:''};
const opills=a=>a&&a.length?a.map(n=>`<span class="opill">${esc(ownerEmoji(n))} ${esc(n)}</span>`).join(''):'<span class="opill none">no owner</span>';
function lineTxt(ln,away,home,final){
  if(!ln)return null;
  const fav=ln.fav_name?`<b>${esc(ln.fav_name)}</b> -${ln.sp!=null?ln.sp:'?'}`:'Pick\u2019em';
  const ml=(ln.aml!=null||ln.hml!=null)?` · ML ${esc(away)} ${fml(ln.aml)} / ${esc(home)} ${fml(ln.hml)}`:'';
  const ou=ln.ou!=null?` · O/U ${ln.ou}`:'';
  return `${final?(ln.type==='close'?'Closing line':'Last line'):'Line'}: ${fav}${ml}${ou} <span class="mut">· ${esc(ln.p||'')}</span>`}
function gameCard(g){
  const fin=g.status==='final',live=g.status==='live';
  const dog=g.line&&g.line.dog;
  const row=(s,other)=>{
    const lose=fin&&!s.win;const tag=g.line?(String(dog)===String(s.id)?' <span title="betting underdog">🐶</span>':(String(g.line.fav)===String(s.id)?' <span title="betting favorite">⭐</span>':'')):'';
    return `<div class="gside${lose?' lose':''}"><div class="nm">${chip(s.id,{big:1,name:s.short})}${s.seed?`<span class="seed">(${s.seed})</span>`:''}${tag}${opills(s.owners)}</div><div class="sc2">${(fin||live)&&s.score!=null?s.score:''}</div></div>`};
  let head=`<span>${fin?'FINAL':live?'<b class="good">LIVE</b>':'<b>'+wibTime(g)+'</b>'}</span>`;
  if(g.round)head+=`<span>· ${esc(g.round)}</span>`;else if(g.kind==='conf')head+='<span>· Conf tournament</span>';
  if(g.neutral)head+='<span>· neutral</span>';
  if(g.h2h)head+=`<span class="h2b">🥊 ${esc(g.away.owners.join('/'))} vs ${esc(g.home.owners.join('/'))}</span>`;
  if(g.civil)head+=`<span class="h2b">🙃 CIVIL WAR (${esc(g.away.owners.join('/'))} wins either way)</span>`;
  let lt=lineTxt(g.line,g.away.short,g.home.short,fin);
  let foot=lt||(fin?'<span class="mut">No betting line on file for this game.</span>':'<span class="mut">📭 line not posted yet</span>');
  if(fin&&g.upset){const u=g.upset;if(u.is)foot+=` <span class="up${u.scored?'':' ns'}">😱 UPSET${u.scored?' +'+D.meta.points.upset:' (not scored: outside upset rules)'}${u.fallback?' ⚠️ by seed':''}</span>`;else if(u.is===false&&g.line)foot+=' <span class="mut">· favorite won, no upset</span>'}
  return `<div class="gm${g.h2h||g.civil?' h2h':''}"><div class="gh">${head}</div>${row(g.away)}${row(g.home)}<div class="gl">${foot}</div></div>`}
let gOwner='all',gMode=null,gDay='all',gH2H=params.has('h2h');
function vGames(){
  const all=D.games||[];
  const ups=all.filter(g=>g.status!=='final'),fin=all.filter(g=>g.status==='final');
  if(!gMode)gMode=ups.length?'upcoming':'scores';
  let list=(gMode==='upcoming'?ups:fin.slice().reverse());
  if(gOwner!=='all')list=list.filter(g=>g.home.owners.includes(gOwner)||g.away.owners.includes(gOwner));
  if(gH2H)list=list.filter(g=>g.h2h||g.civil);
  const days=[...new Set(list.map(wibKey))];
  if(gDay!=='all'&&!days.includes(gDay))gDay='all';
  if(gDay!=='all')list=list.filter(g=>wibKey(g)===gDay);
  if(gMode==='upcoming')list.sort((a,b)=>(a.start||a.day).localeCompare(b.start||b.day));
  let h=`<div class="card"><div class="tabs" style="margin:0 0 8px"><button class="${gMode==='upcoming'?'on':''}" onclick="gMode='upcoming';gDay='all';render()">⏭ Upcoming (${ups.length})</button><button class="${gMode==='scores'?'on':''}" onclick="gMode='scores';gDay='all';render()">✅ Scores (${fin.length})</button></div>
   <div class="tabs" style="margin:0"><select onchange="gOwner=this.value;render()"><option value="all">All owners</option>${D.owners.map(o=>`<option value="${esc(o.name)}"${o.name===gOwner?' selected':''}>${esc(o.emoji)} ${esc(o.name)}</option>`).join('')}</select>
   <select onchange="gDay=this.value;render()"><option value="all">All days</option>${days.map(k=>`<option value="${k}"${k===gDay?' selected':''}>${esc(wibLabel(k))}</option>`).join('')}</select>
   <button class="${gH2H?'on':''}" onclick="gH2H=!gH2H;render()">🥊 Pool vs pool only</button></div>
   <div class="note" style="margin-top:6px">Times in WIB. ⭐ = betting favorite, 🐶 = underdog. Lines: ${D.meta.games_view.n_with_line}/${D.meta.games_view.n_games} games have one on file (${esc((D.meta.sources||{}).odds||'')}).</div></div>`;
  if(!list.length)return h+`<div class="card">${all.length?'Nothing matches those filters.':'No games for rostered teams yet. Check back when the schedule fills in.'}</div>`;
  if(gMode==='upcoming'&&D.meta.mode==='preseason')h+=`<div class="card note">Preseason: only the first few nights of the schedule are loaded, and sportsbooks have posted lines for just some of them so far. Everything refreshes automatically.</div>`;
  let cur=null;
  list.forEach(g=>{const k=wibKey(g);if(k!==cur){cur=k;h+=`<div class="gday">${esc(wibLabel(k))}</div>`}h+=gameCard(g)});
  return h}
function gameLine(g){/* compact line for a team-row game (roster tab) */
  const ln=g.ln;if(!ln)return g.status==='final'?'':'<div class="mut" style="font-size:12px">📭 line not posted yet</div>';
  const fav=ln.fav_name?`${esc(ln.fav_name)} -${ln.sp!=null?ln.sp:'?'}`:'Pick\u2019em';
  let s=`<div class="mut" style="font-size:12px">${g.status==='final'?(ln.type==='close'?'Closing':'Last'):'Line'}: ${fav}${ln.ou!=null?' · O/U '+ln.ou:''}· ${esc(ln.p||'')}${ln.we_dog?' · 🐶 underdog':ln.we_fav?' · ⭐ favorite':''}${g.upset?' <span class="up">😱 UPSET</span>':''}</div>`;
  return s}


/* ---------- side bets ---------- */
let sbScope='all',sbPaid=false,sbPerson='all',sbStatus='all',sbQ='',sbForm=null,sbMsg='',editOK=null;
fetch('api/ping').then(r=>r.json()).then(j=>{editOK=!!j.edit;if(tab==='bets')render()}).catch(()=>{editOK=false});
const P=id=>(D.bets.people.find(p=>p.id===id)||{name:id});
const pname=id=>{const p=P(id);const e=p.pool_owner?ownerEmoji(p.pool_owner):'';return (e?e+' ':'')+esc(p.name)};
function money(v){const c=D.bets.currency||{};const x=v/(c.display_unit||1000);return (c.prefix||'')+(Math.round(x*100)/100).toString()+(c.suffix||'K')}
function vBets(){
  const B=D.bets,T=B.tallies[sbScope][sbPaid?'unpaid':'all'],ids=T.ids;
  const seg=(cur,set,opts)=>opts.map(o=>`<button class="${cur===o[0]?'on':''}" onclick="${set}='${o[0]}';render()">${o[1]}</button>`).join('');
  let h=`<div class="card"><b>🎲 Side bets</b><div class="note">Who owes who, across every wager. Amounts in ${esc(B.currency.code||'')} thousands (${esc(B.currency.suffix||'K')}). Rows owe columns. Non-cash stakes are listed separately.</div>
   <div class="tabs" style="margin-top:8px">${seg(sbScope,'sbScope',[['all','All'],['ledger','New ledger'],['imported','2025-26 import']])}<button class="${sbPaid?'on':''}" onclick="sbPaid=!sbPaid;render()">Hide paid</button></div></div>`;
  h+=`<div class="card sc"><table><tr><th>Person</th><th class="n">Lost</th><th class="n">Won</th><th class="n">Net +/-</th><th class="n">Bets</th><th class="n">Fines</th></tr>${ids.slice().sort((a,b)=>T.net[b]-T.net[a]).map(i=>`<tr><td>${pname(i)}</td><td class="n">${money(T.lost[i])}</td><td class="n">${money(T.won[i])}</td><td class="n"><b class="${T.net[i]>0?'good':T.net[i]<0?'bad':''}">${T.net[i]>0?'+':''}${money(T.net[i])}</b></td><td class="n">${T.bets[i]}</td><td class="n">${B.fines[i]?money(B.fines[i]):'<span class=mut>0</span>'}</td></tr>`).join('')}</table></div>`;
  h+=`<h2>Who owes who</h2><div class="card sc"><table class="mx"><tr><th>owes ↓ / to →</th>${ids.map(i=>`<th>${esc(P(i).name)}</th>`).join('')}</tr>${ids.map(r=>`<tr><td><b>${esc(P(r).name)}</b></td>${ids.map(c=>{const v=T.matrix[r][c];return r===c?'<td class="z">·</td>':v?`<td>${money(v)}</td>`:'<td class="z">0</td>'}).join('')}</tr>`).join('')}</table></div>`;
  if(T.items.length)h+=`<h2>Non-cash IOUs</h2><div class="card">${T.items.map(x=>`<div>${pname(x.from)} owes ${pname(x.to)}: <b>${esc(x.item)}</b> <span class="mut">bet #${esc(x.bet)}${x.paid?' · paid':''}</span></div>`).join('')}</div>`;
  h+=sbBuilder();
  /* list */
  let L=B.bets.filter(b=>sbScope==='all'||b.src===sbScope);
  if(sbPerson!=='all')L=L.filter(b=>b.participants.includes(sbPerson)||b.entries.some(e=>e.from===sbPerson||e.to===sbPerson));

function sbSnap(){const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};sbForm=Object.assign(sbForm||{},{text:g('sb_text'),a:picked('sa'),b:picked('sb'),pp:picked('pp'),stake:g('sb_stake'),item:g('sb_item'),odds:g('sb_odds'),long:g('sb_long'),win:g('sb_win'),buy:g('sb_buy'),pay:g('sb_pay')})}

async function sbSettleGo(){const g=id=>document.getElementById(id);const cur=D.bets.bets.find(b=>b.n===stSel);let patch={};
  if((cur.spec||{}).type==='pool'){patch.payouts={};g('st_pay').value.split(',').forEach(x=>{const [k,v]=x.split(':');if(k&&v)patch.payouts[k.trim().toLowerCase()]=v.trim()})}
  else if(g('st_ga').value||g('st_gb').value){patch.games={a:+g('st_ga').value||0,b:+g('st_gb').value||0}}
  else patch.winner=g('st_win').value;
  sbMsg='Saving…';render();try{const r=await fetch('api/bets/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:stSel,patch})});const j=await r.json();sbMsg=j.ok?'Settled #'+stSel:'Not saved: '+j.error;if(j.ok)load()}catch(e){sbMsg='Failed: '+e}render()}

  <div class="card"><b>Data health</b><ul class="it"><li>Updated: ${esc(m.generated_at_wib)}</li><li>Mode: ${esc(m.mode)} · season ${esc(m.season)} · games loaded ${m.games_loaded} (${m.final_games} final)</li>
   <li>Days fetched fresh ${m.fetch.days_fetched}, cached ${m.fetch.days_cached}, ncaa.com fallback ${m.fetch.days_ncaa_fallback}, failed ${m.fetch.days_failed_both}</li>
   <li>Betting lines found ${m.odds.lines_found}/${m.odds.games_needing_line}</li><li>Rosters: ${esc(m.roster_source)}; sheet ${m.sheet_ok?'OK':'ERROR '+esc(m.sheet_error)}</li>
   ${m.warnings.length?'<li class="bad">Warnings: '+m.warnings.map(esc).join('; ')+'</li>':''}</ul></div>`}
const VIEWS={standings:vStandings,games:vGames,bets:vBets,rosters:vRosters,teams:vTeams,checklist:vChecklist,upsets:vUpsets,redraft:vRedraft,about:vAbout};
function render(){
  if(!D)return;const m=D.meta;
  $('#tag').textContent={preseason:'0-0 and full of hope. The season hasn\u2019t started, so everyone is a genius.',live:'Where college basketball knowledge goes to be humbled.',final:'The season is over. Someone is insufferable now.',demo:'DEMO: last season\u2019s real results run through this year\u2019s rosters. Nobody\u2019s actual points.'}[m.mode]||'';
  $('#badges').innerHTML=`<span class="badge">${esc(m.league)}</span><span class="badge">${esc(m.season)}</span><span class="badge">Updated ${esc(m.generated_at_wib)}</span>`+(m.mode==='demo'?'<span class="badge warn">DEMO DATA</span>':'')+(m.mode==='preseason'?'<span class="badge">PRESEASON</span>':'')+(m.warnings.length?'<span class="badge warn">⚠ '+m.warnings.length+' warning(s) — see Rules &amp; sources</span>':'');
  $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
  $('#main').innerHTML=(VIEWS[tab]||vStandings)();
  $('#foot').innerHTML=`STOOPIDS · times in WIB (Asia/Jakarta) · scores ESPN (fallback ncaa.com) · ${DEMO?'<a href="?">back to the live season</a>':'<a href="?demo=1">see the demo (last season replay)</a>'}`;
}
function load(){
  const s=document.createElement('script');s.src=(DEMO?'demo/':'')+'data.js?v='+Date.now();
  s.onload=()=>{D=window.STOOPIDS_DATA;render()};
  s.onerror=()=>{if(!D)$('#main').innerHTML='<div class="card">Couldn\u2019t load data.js. Run <code>python3 refresh.py</code> first.</div>'};
  document.head.appendChild(s);
}
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
